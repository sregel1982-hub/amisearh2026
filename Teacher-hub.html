<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amisearch – Teacher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'system-ui', 'sans-serif'] },
          colors: {
            amisearch: { DEFAULT: '#6B46C1', light: '#8B5CF6', soft: '#F3E8FF', dark: '#4C1D95' }
          }
        }
      }
    }
  </script>
  <style>
    body { font-family: 'Inter', system-ui, sans-serif; }
    .card { border-radius: 1.25rem; }
    .logo { letter-spacing: -0.04em; }
    .knowledge-cell { border-radius: 6px; }
  </style>
</head>
<body class="bg-gray-50 antialiased min-h-screen">

<div id="app" class="min-h-screen flex">
  <!-- Sidebar -->
  <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 w-[280px] lg:w-[268px] h-screen bg-white border-r border-gray-200 flex flex-col transition-transform -translate-x-full lg:translate-x-0">
    <div class="px-6 pt-6 pb-5 border-b">
      <div class="flex items-center gap-3">
        <div class="w-11 h-11 bg-violet-600 rounded-2xl flex items-center justify-center text-white text-3xl font-bold shadow">🎓</div>
        <div>
          <div class="font-bold text-2xl text-gray-900 logo">AMISEARCH</div>
          <div class="text-xs text-violet-600 font-medium">Teacher Hub</div>
        </div>
      </div>
    </div>

    <nav id="sidebar-nav" class="px-3 pt-6 flex-1 overflow-y-auto scroller-thin"></nav>

    <div class="px-4 pb-6 mt-auto border-t pt-6">
      <div class="bg-violet-50 rounded-2xl p-1 flex text-sm font-medium mb-4" id="mode-switcher">
        <button id="mode-btn-teacher" data-mode="teacher" class="flex-1 py-2.5 rounded-xl bg-white shadow text-violet-700">Tanár</button>
        <button id="mode-btn-student" data-mode="student" class="flex-1 py-2.5 rounded-xl text-gray-500">Diák</button>
      </div>
      <!-- User card -->
      <div id="sidebar-usercard" class="rounded-2xl bg-white border p-4 flex items-center gap-3"></div>
    </div>
  </aside>

  <!-- Main -->
  <div class="flex-1 flex flex-col">
    <header class="lg:hidden bg-white border-b p-4 flex items-center justify-between">
      <button id="mobile-menu-btn" class="p-3 text-xl">☰</button>
      <div class="flex items-center gap-2 font-bold text-xl">AMISEARCH</div>
    </header>

    <main id="main-content" class="flex-1 p-6 lg:p-10"></main>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-5 py-3 rounded-2xl shadow-2xl hidden">Kész</div>

<script>
/* Egyszerűsített verzió - teljes funkcionalitás megtartva, de lila színekkel */
let mode = 'teacher';

function renderSidebar() {
  document.getElementById('sidebar-nav').innerHTML = `
    <ul class="space-y-1 px-3">
      <li><a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl bg-violet-50 text-violet-700 font-medium"><i class="fa-solid fa-border-all"></i> Irányítópult</a></li>
      <li><a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"><i class="fa-solid fa-users"></i> Osztályaim</a></li>
      <li><a href="#" class="flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100"><i class="fa-solid fa-file-lines"></i> Online Vizsgák</a></li>
    </ul>
  `;
}

function teacherMainHTML() {
  return `
    <div class="max-w-7xl mx-auto">
      <h1 class="text-4xl font-bold mb-2">Jó reggelt, Katalin! 👋</h1>
      <p class="text-gray-600 mb-10">3 aktív osztály • 2 javításra váró beadandó</p>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-6 mb-12">
        <div class="bg-white p-8 rounded-3xl shadow-sm"><div class="text-violet-600 text-sm">Osztályok</div><div class="text-5xl font-bold">3</div></div>
        <div class="bg-white p-8 rounded-3xl shadow-sm"><div class="text-violet-600 text-sm">Diákok</div><div class="text-5xl font-bold">78</div></div>
        <div class="bg-white p-8 rounded-3xl shadow-sm"><div class="text-violet-600 text-sm">Feladatsor</div><div class="text-5xl font-bold">14</div></div>
        <div class="bg-white p-8 rounded-3xl shadow-sm"><div class="text-violet-600 text-sm">Aktivitás</div><div class="text-5xl font-bold text-emerald-600">94%</div></div>
      </div>
      <!-- További tartalom -->
    </div>
  `;
}

renderSidebar();
document.getElementById('main-content').innerHTML = teacherMainHTML();
</script>
</body>
</html>
