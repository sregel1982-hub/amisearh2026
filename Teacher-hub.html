<script>// Playables SDK v1.0.0
// Game lifecycle bridge: rAF-based game-ready detection + event communication
(function() {
  'use strict';

  // Idempotency: skip if already initialized (e.g., server-side injection
  // followed by client-side inject-javascript via the Bloks webview component).
  if (window.playablesSDK) return;

  var HANDLER_NAME = 'playablesGameEventHandler';
  var ANDROID_BRIDGE_NAME = '_MetaPlayablesBridge';
  var RAF_FRAME_THRESHOLD = 3;

  var gameReadySent = false;
  var firstInteractionSent = false;
  var errorSent = false;
  var frameCount = 0;
  var originalRAF = window.requestAnimationFrame;

  // --- Transport Layer ---

  function hasIOSBridge() {
    return !!(window.webkit &&
              window.webkit.messageHandlers &&
              window.webkit.messageHandlers[HANDLER_NAME]);
  }

  function hasAndroidBridge() {
    return !!(window[ANDROID_BRIDGE_NAME] &&
              typeof window[ANDROID_BRIDGE_NAME].postEvent === 'function');
  }

  function isInIframe() {
    return !!(window.parent && window.parent !== window);
  }

  function sendEvent(eventName, payload) {
    var message = {
      type: eventName,
      payload: payload || {},
      timestamp: Date.now()
    };

    if (hasIOSBridge()) {
      try {
        window.webkit.messageHandlers[HANDLER_NAME].postMessage(message);
      } catch (e) { /* ignore */ }
      return;
    }

    if (hasAndroidBridge()) {
    try {
      var p = payload || {};
      p.__secureToken = window.__fbAndroidBridgeAuthToken || '';
      p.timestamp = message.timestamp;
      window[ANDROID_BRIDGE_NAME].postEvent(
        eventName,
        JSON.stringify(p)
      );
    } catch (e) { /* ignore */ }
    return;
  }

    if (isInIframe()) {
      try {
        window.parent.postMessage(message, '*');
      } catch (e) { /* ignore */ }
      return;
    }
  }

  // --- rAF Game-Ready Detection ---

  function onFrame() {
    if (gameReadySent) return;

    frameCount++;
    if (frameCount >= RAF_FRAME_THRESHOLD) {
      gameReadySent = true;
      sendEvent('game_ready', {
        frame_count: frameCount,
        detected_at: Date.now()
      });
      return;
    }

    originalRAF.call(window, onFrame);
  }

  if (originalRAF) {
    window.requestAnimationFrame = function(callback) {
      if (!gameReadySent) {
        return originalRAF.call(window, function(timestamp) {
          frameCount++;
          if (frameCount >= RAF_FRAME_THRESHOLD && !gameReadySent) {
            gameReadySent = true;
            sendEvent('game_ready', {
              frame_count: frameCount,
              detected_at: Date.now()
            });
          }
          callback(timestamp);
        });
      }
      return originalRAF.call(window, callback);
    };
  }

  // --- First User Interaction Detection ---

  function setupFirstInteractionDetection() {
    var events = ['touchstart', 'mousedown', 'keydown'];

    function onFirstInteraction() {
      if (firstInteractionSent) return;
      firstInteractionSent = true;
      sendEvent('user_interaction_start', null);

      for (var i = 0; i < events.length; i++) {
        document.removeEventListener(events[i], onFirstInteraction, true);
      }
    }

    for (var i = 0; i < events.length; i++) {
      document.addEventListener(events[i], onFirstInteraction, true);
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', setupFirstInteractionDetection);
  } else {
    setupFirstInteractionDetection();
  }

  // --- Auto Error Capture ---

  window.addEventListener('error', function(event) {
    if (errorSent) return;
    errorSent = true;
    sendEvent('error', {
      message: event.message || 'Unknown error',
      source: event.filename || '',
      lineno: event.lineno || 0,
      colno: event.colno || 0,
      auto_captured: true
    });
  });

  window.addEventListener('unhandledrejection', function(event) {
    if (errorSent) return;
    errorSent = true;
    var reason = event.reason;
    sendEvent('error', {
      message: (reason instanceof Error) ? reason.message : String(reason),
      type: 'unhandled_promise_rejection',
      auto_captured: true
    });
  });

  // --- Public API ---

  window.playablesSDK = {
    complete: function(score) {
      sendEvent('game_ended', {
        score: score,
        completed: true
      });
    },

    error: function(message) {
      if (errorSent) return;
      errorSent = true;
      sendEvent('error', {
        message: message || 'Unknown error',
        auto_captured: false
      });
    },

    sendEvent: function(eventName, payload) {
      if (!eventName || typeof eventName !== 'string') return;
      sendEvent(eventName, payload);
    }
  };

  // Kick off rAF detection in case no game code calls rAF immediately
  if (originalRAF) {
    originalRAF.call(window, onFrame);
  }
})();</script>

let lang = localStorage.getItem('amisearch_lang') || 'hu';
let mode = localStorage.getItem('amisearch_mode') || 'teacher';

function t(key) {
  return (I18N[lang] && I18N[lang][key]) || I18N['hu'][key] || key;
}

function applyI18n(root = document) {
  root.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = t(key);
    if (val) el.textContent = val;
  });
  root.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
    const key = el.getAttribute('data-i18n-placeholder');
    el.placeholder = t(key);
  });
  document.documentElement.lang = lang;
  // lang buttons
  document.querySelectorAll('.lang-btn').forEach(b => {
    const isActive = b.dataset.lang === lang;
    b.classList.toggle('bg-slate-900', isActive);
    b.classList.toggle('text-white', isActive);
    b.classList.toggle('text-slate-600', !isActive);
  });
  // mobile lang btn text
  const mlb = document.getElementById('mobile-lang-btn');
  if (mlb) mlb.textContent = lang.toUpperCase() + ' / ' + (lang === 'hu' ? 'EN' : 'HU');
}

/* Toast */
let toastTimer;
function showToast(msg) {
  const toast = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  toast.classList.remove('translate-y-20', 'opacity-0');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => {
    toast.classList.add('translate-y-20', 'opacity-0');
  }, 2200);
}

            <div id="exam-timer" class="text-[30px] sm:text-[34px] font-[800] tracking-tight text-slate-900 tabular-nums">45:00</div>
          </div>
          <div class="w-full h-1.5 bg-slate-100 rounded-full overflow-hidden mb-4">
            <div id="exam-progress" class="h-full bg-amisearch rounded-full" style="width:100%"></div>
          </div>

          <div class="flex flex-wrap gap-2 text-[13px] font-[600]">
            <button id="exam-generate-btn" class="px-3.5 py-2 rounded-full bg-slate-900 text-white hover:bg-black transition" data-i18n="s_generate_exam">Feladatsor generálása</button>
            <button id="exam-start-btn" class="px-3.5 py-2 rounded-full border border-slate-300 bg-white hover:bg-slate-50 transition" data-i18n="s_start_time">Idő indítása</button>
            <button id="exam-pause-btn" class="px-3.5 py-2 rounded-full border border-slate-300 bg-white hover:bg-slate-50 transition" data-i18n="s_pause">Szünet</button>
            <button id="exam-restart-btn" class="px-3.5 py-2 rounded-full border border-slate-300 bg-white hover:bg-slate-50 transition" data-i18n="s_restart">Újraindítás</button>
            <button id="exam-eval-btn" class="px-3.5 py-2 rounded-full bg-amisearch text-white hover:bg-amisearch-dark transition" data-i18n="s_evaluate">Kiértékelés</button>
          </div>

          <div id="exam-status" class="mt-3 text-[13px] text-slate-600 min-h-[22px]"></div>
        </div>

      </div>
    </div>
  </div>`;
}

/* Mount main content and wire student interactivity */
function renderMain() {
  const main = document.getElementById('main-content');
  const isTeacher = mode === 'teacher';
  main.className = "flex-1 min-h-screen transition-colors duration-300 " + (isTeacher ? "bg-slateink" : "bg-amisearch-soft");
  document.getElementById('app-footer').className = "px-6 lg:px-10 py-6 border-t text-[12.5px] " + (isTeacher ? "bg-slateink border-white/[0.08] text-slate-400" : "bg-amisearch-soft border-rose-100 text-slate-500");
  
  main.innerHTML = isTeacher ? teacherMainHTML() : studentMainHTML();
  applyI18n(main);

  if (!isTeacher) wireStudentFeatures();
}

function renderApp() {
  renderSidebar();
  renderMain();
}

/* --------------------------
   Student interactive logic
--------------------------- */
function wireStudentFeatures() {
  // Upload
  const dropzone = document.getElementById('dropzone');
  const browseBtn = document.getElementById('browse-files-btn');
  const quickUploadBtn = document.getElementById('quick-upload-btn');
  const fileInput = document.getElementById('note-file-input');
  const uploadList = document.getElementById('upload-list');

  function handleFiles(files) {
    if (!files.length) return;
    uploadList.innerHTML = '';
    [...files].slice(0,5).forEach(f => {
      const div = document.createElement('div');
      div.className = "flex items-center justify-between bg-white border border-rose-100 rounded-xl px-3 py-2";
      div.innerHTML = `<span class="truncate"><i class="fa-regular fa-file text-rose-500 mr-2"></i>${f.name}</span><span class="text-[11px] text-slate-500">${Math.round(f.size/1024)} KB</span>`;
      uploadList.appendChild(div);
    });
    showToast(`${files.length} ${t('toast_files_added')}`);
    // Add to notes list (fake)
    const notesList = document.getElementById('notes-list');
    if (notesList && files[0]) {
      const row = document.createElement('div');
      row.className = "py-3.5 flex items-center gap-4";
      row.innerHTML = `
        <div class="w-10 h-10 rounded-xl bg-rose-50 border border-rose-100 text-rose-600 flex items-center justify-center"><i class="fa-regular fa-file"></i></div>
        <div class="flex-1 min-w-0">
          <div class="font-[600] text-[14px] text-slate-900 truncate">${files[0].name.replace(/\.[^/.]+$/, "")}</div>
          <div class="text-[12.5px] text-slate-500">PDF • ${Math.round(files[0].size/1024)} KB • ${lang === 'hu' ? 'éppen most' : 'just now'}</div>
        </div>
        <span class="text-[11px] font-[700] bg-emerald-50 text-emerald-700 px-2 py-1 rounded-full" data-i18n="s_new_badge">${t('s_new_badge')}</span>
        <button class="text-[13px] font-[600] text-slate-600 hover:text-slate-900 px-2" data-i18n="s_open">${t('s_open')}</button>
      `;
      notesList.prepend(row);
    }
  }

  if (dropzone) {
    ['dragenter','dragover'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.add('drag-over'); }));
    ['dragleave','drop'].forEach(ev => dropzone.addEventListener(ev, e => { e.preventDefault(); dropzone.classList.remove('drag-over'); }));
    dropzone.addEventListener('drop', e => {
      handleFiles(e.dataTransfer.files);
    });
  }
  browseBtn?.addEventListener('click', () => fileInput.click());
  quickUploadBtn?.addEventListener('click', () => fileInput.click());
  fileInput.onchange = () => handleFiles(fileInput.files);

  // Task generator
  const taskBtn = document.getElementById('generate-task-btn');
  const taskOutput = document.getElementById('task-output');
  const taskTopic = document.getElementById('task-topic');
  taskBtn?.addEventListener('click', () => {
    const topic = taskTopic.value.trim() || (lang === 'hu' ? 'Deriválás' : 'Derivatives');
    const levelEl = document.getElementById('task-level');
    const levelName = levelEl.options[levelEl.selectedIndex].text;
    taskBtn.disabled = true;
    taskBtn.innerHTML = `<span data-i18n="s_generating">${t('s_generating')}</span>`;
    taskOutput.textContent = '…';
    setTimeout(() => {
      const bankHu = [
        `1) Számítsa ki f(x) = (3x²+1)·sin x deriváltját.`,
        `2) Határozza meg a h(x) = ln(x²+4) szélsőértékeit.`,
        `3) Oldja meg: f'(x) = 0, ha f(x)=x³-6x+2.`
      ];
      const bankEn = [
        `1) Differentiate f(x) = (3x²+1)·sin x.`,
        `2) Find extrema of h(x) = ln(x²+4).`,
        `3) Solve f'(x)=0 for f(x)=x³-6x+2.`
      ];
      taskOutput.innerHTML = `<div class="font-[650] text-slate-900 mb-1">${t('s_tasks_ready')} ${topic} • ${levelName}</div><div class="space-y-1 leading-relaxed">${(lang==='hu'?bankHu:bankEn).map(li=>`<div>${li}</div>`).join('')}</div>`;
      taskBtn.disabled = false;
      taskBtn.innerHTML = `<span data-i18n="s_generate">${t('s_generate')}</span>`;
      showToast(t('toast_tasks_generated'));
    }, 950);
  });

  // Exam simulator
  let totalSeconds = 45 * 60;
  let remaining = totalSeconds;
  let timerId = null;
  const timerEl = document.getElementById('exam-timer');
  const progressEl = document.getElementById('exam-progress');
  const statusEl = document.getElementById('exam-status');

  function updateTimerDisplay() {
    const m = Math.floor(remaining/60).toString().padStart(2,'0');
    const s = (remaining%60).toString().padStart(2,'0');
    timerEl.textContent = `${m}:${s}`;
    progressEl.style.width = Math.max(0, (remaining/totalSeconds*100)) + '%';
  }
  updateTimerDisplay();

  function startTimer() {
    if (timerId) return;
    timerId = setInterval(() => {
      if (remaining > 0) {
        remaining--;
        updateTimerDisplay();
      } else {
        pauseTimer();
      }
    }, 1000);
    timerEl.classList.add('timer-running');
  }
  function pauseTimer() {
    clearInterval(timerId); timerId = null;
    timerEl.classList.remove('timer-running');
  }
  function resetTimer() {
    pauseTimer();
    remaining = totalSeconds;
    updateTimerDisplay();
    statusEl.textContent = t('s_exam_reset');
  }

  document.getElementById('exam-start-btn')?.addEventListener('click', () => { startTimer(); statusEl.textContent = ''; });
  document.getElementById('exam-pause-btn')?.addEventListener('click', () => { pauseTimer(); statusEl.textContent = t('s_exam_paused'); });
  document.getElementById('exam-restart-btn')?.addEventListener('click', resetTimer);
  document.getElementById('exam-generate-btn')?.addEventListener('click', () => { statusEl.textContent = t('s_exam_ready'); });
  document.getElementById('exam-eval-btn')?.addEventListener('click', () => { pauseTimer(); statusEl.textContent = t('s_exam_done'); showToast(t('s_exam_done')); });

  // Quick actions toast
  document.querySelectorAll('.quick-action-btn').forEach(b => b.addEventListener('click', () => showToast(t('toast_coming_soon'))));
}

/* --------------------------
   Global events
--------------------------- */
document.addEventListener('click', (e) => {
  const langBtn = e.target.closest('.lang-btn');
  if (langBtn) {
    lang = langBtn.dataset.lang;
    localStorage.setItem('amisearch_lang', lang);
    renderApp();
    showToast(lang === 'hu' ? I18N.hu.toast_lang_changed : I18N.en.toast_lang_changed_en);
    return;
  }
  const modeBtn = e.target.closest('#mode-switcher button');
  if (modeBtn) {
    mode = modeBtn.dataset.mode;
    localStorage.setItem('amisearch_mode', mode);
    renderApp();
    showToast(mode === 'teacher' ? t('toast_mode_teacher') : t('toast_mode_student'));
    return;
  }
});

// Mobile sidebar
const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('sidebar-backdrop');
function openSidebar(){ sidebar.classList.remove('-translate-x-full'); backdrop.classList.remove('hidden'); }
function closeSidebar(){ sidebar.classList.add('-translate-x-full'); backdrop.classList.add('hidden'); }
document.getElementById('mobile-menu-btn')?.addEventListener('click', openSidebar);
backdrop.addEventListener('click', closeSidebar);
document.getElementById('mobile-lang-btn')?.addEventListener('click', () => {
  lang = lang === 'hu' ? 'en' : 'hu';
  localStorage.setItem('amisearch_lang', lang);
  renderApp();
  showToast(lang === 'hu' ? I18N.hu.toast_lang_changed : I18N.en.toast_lang_changed_en);
});

// Init
renderApp();
applyI18n();
</script>
