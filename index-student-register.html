<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diák regisztráció – Amisearch</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">

<div class="bg-white w-full max-w-md p-6 rounded-2xl shadow-xl">

  <h2 class="text-2xl font-bold mb-4 text-center">Regisztráció</h2>

  <!-- PROFILKÉP -->
  <label class="block mb-2 font-medium">Profilkép (kötelező)</label>
  <input id="profileImage" type="file" accept="image/*"
         class="w-full border p-3 rounded-xl mb-4 bg-white">

  <!-- TELJES NÉV -->
  <input id="fullName"
         class="w-full border p-3 rounded-xl mb-3"
         placeholder="Teljes név">

  <!-- STÁTUSZ (fix: diák) -->
  <div class="mb-3">
    <label class="block mb-1 font-medium">Státusz</label>
    <select id="status"
            class="w-full border p-3 rounded-xl bg-gray-50 text-gray-600">
      <option value="student">Diák</option>
    </select>
  </div>

  <!-- FELHASZNÁLÓNÉV -->
  <input id="username"
         class="w-full border p-3 rounded-xl mb-3"
         placeholder="Felhasználónév">

  <!-- EMAIL -->
  <input id="email"
         class="w-full border p-3 rounded-xl mb-3"
         placeholder="Email">

  <!-- JELSZÓ -->
  <input id="password" type="password"
         class="w-full border p-3 rounded-xl mb-3"
         placeholder="Jelszó">

  <!-- OSZTÁLYKÓD -->
  <input id="classCode"
         class="w-full border p-3 rounded-xl mb-3"
         placeholder="Osztálykód (tanártól kapod)" required>

  <!-- KUPONKÓD -->
  <input id="couponCode"
         class="w-full border p-3 rounded-xl mb-4"
         placeholder="Kuponkód (opcionális)">

  <!-- ÁSZF -->
  <label class="flex items-center gap-2 mb-4 text-sm">
    <input id="terms" type="checkbox" class="w-4 h-4">
    Elfogadom az ÁSZF-et és az Adatvédelmi nyilatkozatot
  </label>

  <!-- REGISZTRÁCIÓ GOMB -->
  <button id="registerStudent"
          class="w-full bg-red-600 text-white py-3 rounded-xl font-medium">
    Fiók létrehozása
  </button>

  <p class="text-center text-sm mt-4">
    Már van fiókod?
    <a href="/login" class="text-red-600 font-medium">Lépj be</a>
  </p>

</div>

<script src="/js/student-register.js"></script>
</body>
</html>
