<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

async function go(section){const ok=['dashboard','classes','exams','analytics','materials'];section=ok.includes(section)?section:'dashboard';history.replaceState(null,'','#'+section);setActive();loading();try{if(section==='dashboard')return dashboard();if(section==='classes')return classPage();if(section==='exams')return exams();if(section==='analytics')return analytics();return materials()}catch(e){$('#main').innerHTML=`<div class="empty"><b>Nem sikerült betölteni</b><span>${esc(e.message)}</span></div>`}}
function bindGo(){$$('[data-go]').forEach(x=>x.onclick=e=>{e.preventDefault();go(x.dataset.go)})}
async function dashboard(){const [cs,ex,acts]=await Promise.all([getClasses(),optional('teacher_exams'),optional('teacher_activity')]);const total=cs.reduce((a,c)=>a+(Number(c.students)||0),0);const name=profile.full_name||profile.fullName||profile.username||user.email;const act=acts.slice(0,4);$('#main').innerHTML=`<div class="page-head"><h1>Jó napot, ${esc(name)}! 👋</h1><p>${cs.filter(c=>c.active).length} aktív osztály · ${ex.length} vizsga vár beadandó</p></div><div class="stats">${stat('♣','Osztályok',cs.length)}${stat('♟','Diákok',total)}${stat('▤','Feladatsor',ex.length)}${stat('⌁','Aktivitás',act.length?Math.min(100,act.length*24)+'%':'0%')}</div><div class="lower"><section class="panel"><h2 class="panel-title"><span class="accent">ϟ</span>Gyors műveletek</h2><div class="quick"><button data-go="exams"><span class="quick-icon">▤</span><span>Új vizsga létrehozása</span></button><button data-go="classes"><span class="quick-icon">♣</span><span>Osztályok kezelése</span></button><button data-go="analytics"><span class="quick-icon">▤</span><span>Statisztikák</span></button><a href="index.html"><span class="quick-icon">⌂</span><span>Vissza a főoldalra</span></a></div></section><section class="panel"><h2 class="panel-title"><span class="accent">⟲</span>Legutóbbi tevékenység</h2><div class="activity">${act.length?act.map((a,i)=>`<div class="activity-row"><span class="activity-icon">${i===0?'▤':i===1?'♟':i===2?'⌁':'!'}</span><div class="activity-copy"><b>${esc(a.title||a.message||a.name||'Tevékenység')}</b><span>${esc(a.time_label||'Most')}</span></div></div>`).join(''):cs.length?cs.slice(0,4).map(c=>`<div class="activity-row"><span class="activity-icon">♣</span><div class="activity-copy"><b>${esc(c.name)}</b><span>${esc(c.subject)} · ${Number(c.students)||0} diák</span></div></div>`).join(''):`<div class="empty"><b>Még nincs aktivitás</b><span>A mentett osztályok itt jelennek meg.</span></div>`}</div></section></div>`;bindGo()}
async function classPage(){const cs=await getClasses();$('#main').innerHTML=`<div class="subpage-head"><div><h1>Osztályaim</h1><p>Kezeld az osztályaidat és a hozzájuk tartozó létszámot.</p></div></div><section class="panel form-panel"><h2 class="panel-title"><span class="accent">+</span>Új osztály</h2><form id="classForm" class="form-grid"><div class="field"><label>Osztály neve</label><input class="input" id="cName" required placeholder="9.B osztály"></div><div class="field"><label>Tantárgy</label><input class="input" id="cSubject" required placeholder="Matematika"></div><div class="field"><label>Diáklétszám</label><input class="input" id="cStudents" type="number" min="0" value="0"></div><button class="btn btn-primary" type="submit">Létrehozás</button></form></section><section class="class-grid">${cs.length?cs.map(c=>`<article class="class-card"><div class="class-top"><div><h3>${esc(c.name)}</h3><div class="class-sub">${esc(c.subject)}</div></div><span class="pill ${c.active?'on':'off'}">${c.active?'Aktív':'Archivált'}</span></div><div class="class-foot"><span>♣ ${Number(c.students)||0} diák</span><span><button class="text-btn" data-toggle="${esc(c.id)}" data-active="${c.active}">${c.active?'Archiválás':'Aktiválás'}</button><button class="text-btn danger" data-delete="${esc(c.id)}">Törlés</button></span></div></article>`).join(''):`<div class="empty"><b>Még nincs osztályod</b><span>A fenti űrlappal hozz létre egyet.</span></div>`}</section>`;$('#classForm').onsubmit=async e=>{e.preventDefault();try{const {error}=await supabase.from('teacher_classes').insert({teacher_id:user.id,name:$('#cName').value.trim(),subject:$('#cSubject').value.trim(),students:Number($('#cStudents').value)||0,active:true});if(error)throw error;toast('Osztály létrehozva');go('classes')}catch(x){toast(x.message,true)}};$$('[data-toggle]').forEach(b=>b.onclick=async()=>{try{const {error}=await supabase.from('teacher_classes').update({active:b.dataset.active!=='true'}).eq('id',b.dataset.toggle).eq('teacher_id',user.id);if(error)throw error;go('classes')}catch(x){toast(x.message,true)}});$$('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Biztosan törlöd ezt az osztályt?'))return;try{const {error}=await supabase.from('teacher_classes').delete().eq('id',b.dataset.delete).eq('teacher_id',user.id);if(error)throw error;toast('Osztály törölve');go('classes')}catch(x){toast(x.message,true)}})}
function exams(){$('#main').innerHTML=`<div class="subpage-head"><div><h1>Online Vizsgák</h1><p>Az AI vizsgaszimulátor továbbra is a főoldalon érhető el.</p></div></div><section class="exam"><div><h2>AI vizsgaszimulátor</h2><p>Adj meg témát, nehézséget és időtartamot, az AI elkészíti az időzített feladatsort.</p></div><a class="btn" href="index.html#exam-simulator">Megnyitás →</a></section>`}
async function analytics(){const cs=await getClasses();const total=cs.reduce((a,c)=>a+(Number(c.students)||0),0);const max=Math.max(...cs.map(c=>Number(c.students)||0),1);const avg=cs.length?Math.round(total/cs.length):0;$('#main').innerHTML=`<div class="subpage-head"><div><h1>Analitika</h1><p>Valós osztályadatok, demo számok nélkül.</p></div></div><div class="analytics-grid">${stat('♣','Összes diák',total)}${stat('▤','Osztályok',cs.length)}${stat('⌁','Átlag osztálylétszám',avg)}</div><section class="panel"><h2 class="panel-title"><span class="accent">⌁</span>Osztályonkénti létszám</h2>${cs.length?`<div class="chart">${cs.map(c=>`<div class="bar-item"><span class="bar-value">${Number(c.students)||0}</span><div class="bar-track"><div class="bar-fill" style="height:${Math.max(3,Math.round((Number(c.students)||0)/max*100))}%"></div></div><span class="bar-label" title="${esc(c.name)}">${esc(c.name)}</span></div>`).join('')}</div>`:`<div class="empty"><b>Nincs adat</b><span>Hozz létre osztályokat, hogy megjelenjen az analitika.</span></div>`}</section>`}
async function materials(){const ns=await getNotes();$('#main').innerHTML=`<div class="subpage-head"><div><h1>Tananyagok</h1><p>A saját fiókodba feltöltött jegyzeteid.</p></div></div><div class="notice">A fájlok a Supabase Storage privát <b>teacher-notes</b> bucketjébe kerülnek.</div><section class="panel"><h2 class="panel-title"><span class="accent">↑</span>Tananyag feltöltése</h2><form id="uploadForm" class="upload-grid"><div class="field"><label>Cím</label><input class="input" id="nTitle" placeholder="Algebra alapok"></div><div class="field"><label>Tantárgy</label><input class="input" id="nSubject" placeholder="Matematika"></div><div class="field"><label>Fájl, max. 15 MB</label><div class="file-input"><input id="nFile" type="file" accept=".pdf,.docx,.pptx,.txt,.md" required></div></div><button class="btn btn-primary" type="submit">Feltöltés</button></form><div class="material-grid">${ns.length?ns.map(n=>`<article class="material-card"><span class="file-icon">▤</span><div class="material-copy"><b>${esc(n.title||n.original_name)}</b><span>${esc(n.subject||'Nincs tantárgy')}</span></div><button class="download" data-download="${esc(n.id)}">↓</button></article>`).join(''):`<div class="empty"><b>Még nincs feltöltött tananyagod</b><span>Az első fájl feltöltése után itt lesz mindenhol elérhető.</span></div>`}</div></section>`;$('#uploadForm').onsubmit=async e=>{e.preventDefault();const file=$('#nFile').files[0];if(!file)return;if(file.size>15*1024*1024)return toast('A fájl legfeljebb 15 MB lehet.',true);try{const path=user.id+'/'+crypto.randomUUID()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');const up=await supabase.storage.from('teacher-notes').upload(path,file,{upsert:false,contentType:file.type||'application/octet-stream'});if(up.error)throw up.error;const ins=await supabase.from('teacher_notes').insert({owner_id:user.id,title:$('#nTitle').value.trim()||file.name,subject:$('#nSubject').value.trim(),original_name:file.name,storage_path:path});if(ins.error)throw ins.error;toast('Tananyag feltöltve');go('materials')}catch(x){toast(x.message,true)}};$$('[data-download]').forEach(b=>b.onclick=async()=>{try{const n=ns.find(x=>x.id===b.dataset.download);const r=await supabase.storage.from('teacher-notes').createSignedUrl(n.storage_path,3600);if(r.error)throw r.error;window.open(r.data.signedUrl,'_blank','noopener')}catch(x){toast(x.message,true)}})}
$$('.nav button').forEach(b=>b.onclick=()=>{go(b.dataset.section);$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.add('hidden')});$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#mobileOverlay').classList.remove('hidden')};$('#mobileOverlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.add('hidden')};$('#logoutSide').onclick=async()=>{await supabase.auth.signOut();location.href='index.html'};window.addEventListener('hashchange',()=>go(location.hash.slice(1)));
async function boot(){const {data}=await supabase.auth.getSession();if(!data.session){location.replace('index.html?return=teacher-hub');return}user=data.session.user;profile=await loadProfile();if(!profile||!isTeacher()){location.replace('index.html?role=teacher-required');return}const name=profile.full_name||profile.fullName||profile.username||user.email;const plan=String(profile.plan||'Free').toLowerCase()==='pro'?'Pro':'Free';$('#topName').textContent=profile.username||user.email.split('@')[0];$('#topRole').textContent='Tanár · '+plan;$('#topAvatar').textContent=initials(name).slice(0,1);$('#miniName').textContent=name;$('#miniPlan').textContent='Tanár · '+plan;$('#miniAvatar').textContent=initials(name).slice(0,1);$('#authLoading').remove();$('#app').classList.remove('hidden');await go(location.hash.slice(1)||'dashboard');supabase.auth.onAuthStateChange((_event,s)=>{if(!s)location.href='index.html'})}
boot().catch(e=>{console.error(e);$('#authLoading').textContent='A Teacher Hub nem tudott kapcsolódni. Nyisd meg újra a főoldalról.'});
</script>
