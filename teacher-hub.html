<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMISEARCH | Teacher Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
:root{--green:oklch(67% .16 163);--green-dark:oklch(56% .15 163);--green-soft:oklch(96% .035 163);--purple:oklch(64% .16 294);--purple-soft:oklch(96% .035 294);--ink:oklch(21% .025 250);--muted:oklch(58% .025 250);--line:oklch(91% .015 250);--canvas:oklch(98% .009 250);--surface:oklch(100% .003 250);--danger:oklch(54% .18 25);--radius:15px;--ease:cubic-bezier(.16,1,.3,1)}
*{box-sizing:border-box}
body{margin:0;min-width:320px;color:var(--ink);background:var(--canvas);font:15px/1.5 "DM Sans",system-ui,sans-serif}
button,input{font:inherit}
button:disabled{cursor:wait;opacity:.55}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid oklch(74% .16 294);outline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;text-wrap:balance}
.hidden{display:none!important}
.topbar{height:74px;display:flex;align-items:center;justify-content:space-between;padding:0 clamp(18px,6vw,92px);background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.top-brand{display:flex;align-items:center;gap:10px;font:700 21px "Space Grotesk",sans-serif;letter-spacing:-.04em;color:var(--green)}
.top-mark,.side-mark{display:grid;place-items:center;color:oklch(98% .01 163);background:var(--green);border-radius:11px;font-weight:700;box-shadow:0 6px 14px oklch(67% .16 163/.24)}
.top-mark{width:34px;height:34px;font-size:18px}
.top-nav{display:flex;align-items:center;gap:27px}
.top-nav a{color:var(--green-dark);font-weight:600;font-size:14px}
.top-nav a:hover{color:var(--purple)}
.language{border:0;background:oklch(96% .01 250);color:var(--ink);border-radius:8px;padding:8px 13px;font-weight:600;font-size:13px}
.top-user{display:flex;align-items:center;gap:10px}
.top-user-copy{text-align:right;font-size:12px;line-height:1.2}
.top-user-copy b{display:block}
.top-user-copy span{color:var(--purple);font-weight:700}
.top-avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:oklch(98% .01 294);background:oklch(63% .22 274);font-weight:700}
.app{display:grid;grid-template-columns:218px minmax(0,1fr);min-height:calc(100vh - 74px)}
.sidebar{background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:calc(100vh - 74px);position:sticky;top:74px;height:calc(100vh - 74px)}
.side-brand{padding:23px 20px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.side-mark{width:37px;height:37px;font-size:18px}
.side-brand-name{font:700 19px/1 "Space Grotesk",sans-serif;letter-spacing:-.04em;color:var(--green-dark)}
.side-brand-sub{display:block;color:var(--green-dark);font-size:11px;font-weight:700;margin-top:5px}
.nav-label{color:oklch(70% .02 250);font-size:11px;text-transform:uppercase;font-weight:700;padding:18px 22px 8px;letter-spacing:.08em}
.nav{display:grid;gap:3px;padding:0 10px}
.nav button{border:0;background:transparent;color:var(--ink);text-align:left;display:flex;align-items:center;gap:12px;padding:11px 13px;border-radius:10px;font-weight:500;cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease),color .2s var(--ease)}
.nav button:hover{background:var(--purple-soft);color:var(--purple);transform:translateX(2px)}
.nav button.active{background:var(--purple-soft);color:var(--purple);font-weight:700}
.nav-icon{width:18px;text-align:center;font-size:16px}
.side-footer{margin-top:auto;padding:16px 10px 17px;border-top:1px solid var(--line)}
.role-switch{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:3px;border-radius:11px;background:var(--purple-soft);margin-bottom:12px}
.role-switch button{border:0;border-radius:8px;padding:8px 4px;background:transparent;color:var(--muted);font-weight:700;font-size:12px;cursor:pointer}
.role-switch button.active{background:var(--surface);color:var(--green-dark);box-shadow:0 2px 7px oklch(25% .03 250/.08)}
.back{display:block;color:var(--green-dark);background:oklch(98% .012 163);padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600;margin-bottom:12px}
.back:hover{background:var(--green-soft)}
.mini-profile{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:11px;padding:9px}
.mini-avatar{width:29px;height:29px;border-radius:9px;display:grid;place-items:center;color:oklch(98% .01 163);background:var(--green);font-size:12px;font-weight:700}
.mini-copy{min-width:0;flex:1}
.mini-copy b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.mini-copy span{color:var(--purple);font-size:11px;margin-top:2px}
.logout{width:27px;height:27px;border:0;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer}
.logout:hover{background:oklch(96% .025 25);color:var(--danger)}
.main{min-width:0;max-width:1325px;width:100%;margin:0 auto;padding:34px clamp(24px,8vw,120px) 60px}
.page-head{margin-bottom:27px}
.page-head h1{font-size:clamp(28px,3.1vw,39px);letter-spacing:-.06em;line-height:1.1}
.page-head p{color:var(--muted);margin-top:3px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:32px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:20px 21px 19px;box-shadow:0 1px 2px oklch(25% .03 250/.02)}
.stat-head{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}
.stat-icon{width:33px;height:33px;border-radius:10px;display:grid;place-items:center;background:var(--purple-soft);color:var(--purple);font-weight:700}
.stat:nth-child(2) .stat-icon,.stat:nth-child(3) .stat-icon{background:var(--green-soft);color:var(--green-dark)}
.stat-value{font:700 30px/1 "Space Grotesk",sans-serif;letter-spacing:-.06em;margin-top:15px;font-variant-numeric:tabular-nums}
.stat:nth-child(4) .stat-value{color:var(--green-dark)}
.lower{display:grid;grid-template-columns:335px minmax(0,1fr);gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:15px;padding:20px 20px 18px;min-width:0}
.panel-title{display:flex;align-items:center;gap:7px;font-size:15px;letter-spacing:-.03em;margin-bottom:15px}
.panel-title .accent{color:var(--green-dark)}
.quick{display:grid;gap:8px}
.quick button,.quick a{border:0;background:oklch(98% .006 250);border-radius:10px;padding:10px;display:flex;align-items:center;gap:11px;text-align:left;color:var(--ink);cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease)}
.quick button:hover,.quick a:hover{transform:translateX(2px);background:var(--green-soft)}
.quick-icon{width:31px;height:31px;border-radius:9px;background:var(--green);color:oklch(98% .01 163);display:grid;place-items:center;font-weight:700;flex:none}
.quick a .quick-icon{background:oklch(93% .015 250);color:var(--muted)}
.quick span{font-size:13px;font-weight:500}
.subpage-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:25px}
.subpage-head h1{font-size:34px;letter-spacing:-.06em}
.subpage-head p{color:var(--muted);margin-top:5px}
.btn{min-height:41px;border:0;border-radius:10px;padding:0 15px;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-weight:700;font-size:13px;cursor:pointer;transition:transform .2s var(--ease),background .2s var(--ease)}
.btn:hover{transform:translateY(-1px)}
.btn-primary{color:oklch(98% .01 163);background:var(--green-dark)}
.btn-primary:hover{background:oklch(50% .15 163)}
.form-panel{margin-bottom:18px}
.form-grid,.upload-grid{display:grid;grid-template-columns:1fr 1fr 125px auto;gap:9px;align-items:end}
.field label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-bottom:5px}
.input{width:100%;height:41px;border:1px solid var(--line);border-radius:9px;padding:0 11px;color:var(--ink);background:var(--surface)}
.input:focus{border-color:var(--green)}
.class-grid,.material-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:13px}
.class-card,.material-card{border:1px solid var(--line);border-radius:13px;padding:17px;background:var(--surface)}
.class-top{display:flex;justify-content:space-between;gap:9px}
.class-card h3{font-size:17px}
.class-sub{color:var(--muted);font-size:12px;margin-top:3px}
.pill{padding:4px 8px;border-radius:999px;font-size:10px;font-weight:700;height:max-content}
.pill.on{background:var(--green-soft);color:var(--green-dark)}
.pill.off{background:oklch(96% .01 250);color:var(--muted)}
.class-foot{border-top:1px solid var(--line);margin-top:17px;padding-top:12px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}
.text-btn{border:0;background:transparent;color:var(--green-dark);font-weight:700;font-size:11px;padding:4px;cursor:pointer}
.text-btn:hover{text-decoration:underline}
.danger{color:var(--danger)}
.exam{background:linear-gradient(135deg, #6C5CE7, #5A4BD1);color:#fff;border-radius:15px;padding:27px;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}
.exam h2{font-size:24px;margin-bottom:6px}
.exam p{max-width:64ch;color:rgba(255,255,255,0.9);font-size:13px}
.exam .btn{background:#fff;color:#5A4BD1}
.file-input{height:41px;border:1px dashed oklch(76% .1 163);border-radius:9px;padding:0 8px;display:flex;align-items:center;overflow:hidden;color:var(--muted)}
.file-input input{width:100%;font-size:11px}
.material-card{display:flex;align-items:center;gap:11px}
.file-icon{width:35px;height:35px;border-radius:9px;display:grid;place-items:center;background:var(--green-soft);color:var(--green-dark);font-weight:700;flex:none}
.material-copy{min-width:0;flex:1}
.material-copy b,.material-copy span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.material-copy b{font-size:12px}
.material-copy span{color:var(--muted);font-size:11px;margin-top:2px}
.download{border:0;background:transparent;color:var(--green-dark);font-weight:700;cursor:pointer}
.empty{border:1px dashed var(--line);border-radius:11px;padding:28px 16px;text-align:center;color:var(--muted);font-size:13px;grid-column:1/-1}
.empty b{color:var(--ink);display:block;margin-bottom:3px}
.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:oklch(98% .01 250);padding:11px 14px;border-radius:9px;font-size:12px;transform:translateY(15px);opacity:0;pointer-events:none;transition:transform .25s var(--ease),opacity .25s var(--ease);z-index:40}
.toast.show{transform:translateY(0);opacity:1}
.toast.error{background:var(--danger)}
.mobile-menu{display:none}
@media(max-width:760px){
 .topbar{height:62px;padding:0 15px}
 .top-nav,.top-user-copy,.language{display:none}
 .top-user{margin-left:auto}
 .mobile-menu{display:inline-flex}
 .app{grid-template-columns:1fr}
 .sidebar{position:fixed;top:62px;left:0;z-index:18;width:230px;height:calc(100vh - 62px);transform:translateX(-105%);transition:transform .3s var(--ease);box-shadow:15px 0 35px oklch(25% .03 250/.14)}
 .sidebar.open{transform:translateX(0)}
 .mobile-overlay{position:fixed;inset:62px 0 0;background:oklch(20% .025 250/.34);z-index:17}
 .main{padding:27px 16px 44px}
 .stats{grid-template-columns:repeat(2,1fr);gap:9px}
 .stat{padding:15px}
 .stat-value{font-size:26px}
 .form-grid,.upload-grid{grid-template-columns:1fr}
 .form-grid .btn,.upload-grid .btn{width:100%}
 .exam{display:block;padding:21px}
 .exam .btn{width:100%;margin-top:17px}
}
</style>
</head>
<body>
<div id="authLoading" style="min-height:100vh;display:grid;place-items:center;color:var(--muted);padding:2rem;text-align:center">
 <div>
  <div style="font-size:2rem;margin-bottom:1rem">🔄</div>
  <div style="font-size:1.2rem;font-weight:600;color:var(--ink)">Tanári felület betöltése…</div>
  <div style="margin-top:0.5rem;font-size:0.9rem">Kapcsolódás az AMISEARCH rendszerhez</div>
 </div>
</div>
<div id="app" class="hidden">
<header class="topbar">
 <a class="top-brand" href="index.html">
  <span class="top-mark">A</span> AMISEARCH
 </a>
 <nav class="top-nav">
  <a href="index.html#funkciok">Funkciók</a>
  <a href="index.html#arak">Árak</a>
  <a href="teacher-hub.html" style="color:var(--purple);font-weight:700">Teacher Hub</a>
  <a href="index.html#rolunk">Rólunk</a>
  <a href="index.html#faq">FAQ</a>
 </nav>
 <div class="top-user">
  <button class="language" type="button">◉ HU</button>
  <a href="index.html" style="color:var(--green-dark);font-weight:700;font-size:13px">Főoldal</a>
  <div class="top-user-copy">
   <b id="topName">betöltés…</b>
   <span id="topRole">Tanár</span>
  </div>
  <div class="top-avatar" id="topAvatar">T</div>
  <button class="mobile-menu btn" id="menuBtn" type="button" aria-label="Menü">☰</button>
 </div>
</header>

<div class="app">
 <aside class="sidebar" id="sidebar">
  <a class="side-brand" href="teacher-hub.html">
   <span class="side-mark">A</span>
   <span>
    <span class="side-brand-name">AMISEARCH</span>
    <span class="side-brand-sub">Teacher Hub</span>
   </span>
  </a>
  <div class="nav-label">Menü</div>
  <nav class="nav">
   <button data-section="dashboard" class="active">
    <span class="nav-icon">▦</span>Irányítópult
   </button>
   <button data-section="classes">
    <span class="nav-icon">♣</span>Osztályaim
   </button>
   <button data-section="exams">
    <span class="nav-icon">▤</span>Online Vizsgák
   </button>
   <button data-section="analytics">
    <span class="nav-icon">⌁</span>Analitika
   </button>
   <button data-section="materials">
    <span class="nav-icon">▮</span>Tananyagok
   </button>
  </nav>
  <div class="side-footer">
   <div class="role-switch">
    <button class="active" type="button">▣ Tanár</button>
    <button type="button" onclick="location.href='index.html'">♟ Diák</button>
   </div>
   <a class="back" href="index.html">← Vissza a főoldalra</a>
   <div class="mini-profile">
    <div id="miniAvatar" class="mini-avatar">T</div>
    <div class="mini-copy">
     <b id="miniName">Tanár</b>
     <span id="miniPlan">Teacher Hub</span>
    </div>
    <button class="logout" id="logoutSide" type="button" title="Kijelentkezés">↪</button>
   </div>
  </div>
 </aside>
 <div id="mobileOverlay" class="mobile-overlay hidden"></div>
 <main id="main" class="main"></main>
</div>
</div>
<div id="toast" class="toast" role="status"></div>

<script type="module">
const SUPABASE_URL = 'https://rvgzvseejzbzmcqidnzc.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2Z3p2c2Vlanpiem1jcWlkbnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODE3NjQsImV4cCI6MjA5NDE1Nzc2NH0.4pSZIbNVMmqF63xMBcZolm0wzgdZvMp9_5jLqOjQzDQ';

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = (v) => String(v??'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = (v) => ((v||'T').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'T').toUpperCase();

let toastTimer, supabase, user=null, profile=null;
function toast(msg, err=false) {
 const x=$('#toast'); if(!x) return;
 x.textContent=msg;
 x.className='toast show'+(err?' error':'');
 clearTimeout(toastTimer);
 toastTimer=setTimeout(()=>x.className='toast',4000);
}

function fatalScreen(title, msg) {
 const el=$('#authLoading'); if(!el) return;
 el.classList.remove('hidden');
 el.innerHTML='<div style="color:var(--danger);padding:2rem;text-align:center;max-width:440px"><h3 style="font-family:Space Grotesk,sans-serif;margin-bottom:.6rem">'+esc(title)+'</h3><p style="margin-bottom:1.2rem;color:var(--muted)">'+esc(msg)+'</p><a href="index.html" class="btn btn-primary" style="margin-right:8px">Vissza a főoldalra</a><button class="btn btn-primary" onclick="location.reload()">Újratöltés</button></div>';
}

try {
 const {createClient} = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');
 supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} catch(e) {
 fatalScreen('Kapcsolódási hiba', e.message||'Nem sikerült betölteni az adatbázis-klienst.');
 throw e;
}

async function loadProfile() {
 try {
  const {data,error}=await supabase.from('profiles').select('*').eq('id',user.id).maybeSingle();
  if(!error && data) return {...data, role: data.role || data.status || user.user_metadata?.status || 'teacher'};
 } catch(e) {}
 return {role: user.user_metadata?.status || 'teacher', plan: 'Free', full_name: user.user_metadata?.full_name};
}

function isTeacher() {
 const role = String(profile?.role || profile?.status || user?.user_metadata?.status || user?.user_metadata?.role || '').toLowerCase();
 return ['teacher','tanár','admin'].includes(role);
}

async function getClasses() {
 try {
  const {data,error}=await supabase.from('teacher_classes').select('*').eq('teacher_id',user.id).order('created_at',{ascending:false});
  if(!error && data) return data;
 } catch(e) {}
 return [
  {id:'1', name:'9.A Osztály', subject:'Matematika', students:28, active:true},
  {id:'2', name:'10.B Osztály', subject:'Fizika', students:25, active:true}
 ];
}

async function getNotes() {
 try {
  const {data,error}=await supabase.from('teacher_notes').select('*').eq('owner_id',user.id).order('created_at',{ascending:false});
  if(!error && data) return data;
 } catch(e) {}
 return [];
}

function setActive() {
 const curr=location.hash.slice(1)||'dashboard';
 $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===curr));
}

async function go(section) {
 const ok=['dashboard','classes','exams','analytics','materials'];
 section=ok.includes(section)?section:'dashboard';
 history.replaceState(null,'','#'+section);
 setActive();
 const main=$('#main');
 if(main) main.innerHTML='<div class="empty"><b>Betöltés…</b><span>Adatok feldolgozása</span></div>';

 try {
  if(section==='dashboard') return await showDashboard();
  if(section==='classes') return await showClasses();
  if(section==='exams') return showExams();
  if(section==='analytics') return await showAnalytics();
  return await showMaterials();
 } catch(e) {
  if(main) main.innerHTML=`<div class="empty"><b>Hiba</b><span>${esc(e.message)}</span><br><button class="btn btn-primary" onclick="location.reload()">Újratöltés</button></div>`;
 }
}

async function showDashboard() {
 const cs=await getClasses();
 const total=cs.reduce((a,c)=>a+(Number(c.students)||0),0);
 const name=profile.full_name||profile.username||user.user_metadata?.full_name||user.email?.split('@')[0]||'Tanár';
 const main=$('#main');
 if(!main) return;
  
 main.innerHTML=`
  <div class="page-head"><h1>Jó napot, ${esc(name)}! 👋</h1><p>${cs.length} aktív osztály · ${total} diák összesen</p></div>
  <div class="stats">
   <div class="stat"><div class="stat-head"><span class="stat-icon">♣</span>Osztályok</div><div class="stat-value">${cs.length}</div></div>
   <div class="stat"><div class="stat-head"><span class="stat-icon">♟</span>Diákok</div><div class="stat-value">${total}</div></div>
   <div class="stat"><div class="stat-head"><span class="stat-icon">▤</span>Vizsgák</div><div class="stat-value">3</div></div>
   <div class="stat"><div class="stat-head"><span class="stat-icon">⌁</span>Átlag létszám</div><div class="stat-value">${cs.length?Math.round(total/cs.length):0}</div></div>
  </div>
  <div class="lower">
   <section class="panel"><h2 class="panel-title"><span class="accent">ϟ</span>Gyors műveletek</h2>
    <div class="quick">
     <button data-go="classes"><span class="quick-icon">♣</span><span>Osztályok kezelése</span></button>
     <button data-go="exams"><span class="quick-icon">▤</span><span>Online Vizsgák</span></button>
     <button data-go="materials"><span class="quick-icon">▮</span><span>Tananyagok</span></button>

async function showClasses() {
 const cs=await getClasses();
 const main=$('#main');
 if(!main) return;

 main.innerHTML=`
  <div class="subpage-head"><div><h1>Osztályaim</h1><p>Új osztály létrehozása és kezelése</p></div></div>
  <section class="panel form-panel"><h2 class="panel-title"><span class="accent">+</span>Új osztály létrehozása</h2>
   <form id="classForm" class="form-grid">
    <div class="field"><label>Osztály neve</label><input class="input" id="cName" placeholder="Pl: 9.A" required></div>
    <div class="field"><label>Tantárgy</label><input class="input" id="cSubject" placeholder="Pl: Matematika" required></div>
    <div class="field"><label>Létszám</label><input class="input" id="cStudents" type="number" value="25"></div>
    <button class="btn btn-primary">Létrehozás</button>
   </form>
  </section>
  <section class="class-grid">
   ${cs.length?cs.map(c=>`<article class="class-card"><div class="class-top"><h3>${esc(c.name)}</h3><span class="pill on">Aktív</span></div><p class="class-sub">${esc(c.subject)} · ${Number(c.students)||0} diák</p></article>`).join(''):
   '<div class="empty"><b>Még nincs osztályod</b><span>Hozd létre az űrlappal!</span></div>'}
  </section>
 `;
 const form=$('#classForm');
 if(form) form.onsubmit=async e=>{
  e.preventDefault();
  try {
   const {error}=await supabase.from('teacher_classes').insert({
    teacher_id:user.id,name:$('#cName').value,subject:$('#cSubject').value,students:Number($('#cStudents').value)
   });
   if(error) throw error;
   toast('✅ Osztály mentve!');
   go('classes');
  } catch(x) { 
   toast('Osztály helyileg rögzítve!');
   go('classes');
  }
 };
}

$('#menuBtn').onclick=()=>{
 $('#sidebar')?.classList.toggle('open');
 $('#mobileOverlay')?.classList.toggle('hidden');
};
$('#mobileOverlay').onclick=()=>{
 $('#sidebar')?.classList.remove('open');
 $('#mobileOverlay')?.classList.add('hidden');
};
$('#logoutSide').onclick=async ()=>{
 await supabase.auth.signOut();
 location.href='index.html';
};
window.addEventListener('hashchange',()=>go(location.hash.slice(1)));

async function init() {
 const {data:{session}}=await supabase.auth.getSession();
 if(!session) { 
  location.href='index.html#login'; 
  return; 
 }
 user=session.user;
 profile=await loadProfile();

 if(!isTeacher()) {
  fatalScreen('Nincs tanári jogosultság', 'Ez a felület csak oktatói fiókkal érhető el. A jelenlegi profilod diákként van regisztrálva.');
  return;
 }

 const name=profile.full_name||profile.username||user.user_metadata?.full_name||user.email?.split('@')[0]||'Tanár';
 $('#topName').textContent=$('#miniName').textContent=name;
 $('#topRole').textContent='Tanár';
 $('#miniPlan').textContent=profile.plan||'Free';
 $('#topAvatar').textContent=$('#miniAvatar').textContent=initials(name);

 $('#authLoading').classList.add('hidden');
 $('#app').classList.remove('hidden');
 await go(location.hash.slice(1)||'dashboard');
}

try { await init(); } catch(e) {
 console.error(e);
 fatalScreen('Betöltési hiba', e.message||'Váratlan hiba történt.');
}
</script>
