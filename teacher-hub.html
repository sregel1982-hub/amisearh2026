<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMISEARCH – Teacher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
          colors: {
            amisearch: { DEFAULT: '#6C5CE7', light: '#A29BFE', soft: '#F3F0FF', dark: '#5A4BD1' }

        }
      }
    }
  </script>
  <style>
    * { font-family: 'Poppins', system-ui, sans-serif; box-sizing: border-box; }
    body { scroll-behavior: smooth; overflow-x: hidden; }
    .card { border-radius: 1.25rem; }
    .logo { letter-spacing: -0.04em; }

    .btn-primary {
      background: linear-gradient(135deg, #6C5CE7 0%, #5A4BD1 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.4);
    }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; transform: none; box-shadow: none; }

    .gradient-text {
      background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-link-active {
      background: #F3F0FF;
      color: #6C5CE7;
      font-weight: 600;
    }

    .scroller-thin::-webkit-scrollbar { width: 4px; }
    .scroller-thin::-webkit-scrollbar-track { background: transparent; }
    .scroller-thin::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease; }

    .stat-card { transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1); }
    .stat-card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px -8px rgba(108, 92, 231, 0.18); }

    .modal { display: none; }
    .modal.active { display: flex; }

    #authGate {
      position: fixed; inset: 0; z-index: 100; background: #F9FAFB;
      display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 1rem;
    }
  </style>
</head>
<body class="bg-gray-50 antialiased min-h-screen">

<!-- ── Auth / role gate ── -->

</div>

<div id="app" class="min-h-screen hidden">
  <div class="flex">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 w-[268px] h-screen bg-white border-r border-gray-200 flex flex-col transition-transform -translate-x-full lg:translate-x-0 shadow-sm">

    <div class="px-6 pt-6 pb-5 border-b border-gray-100">

        <div class="w-11 h-11 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-2xl flex items-center justify-center text-white text-xl shadow">
          <i class="fa-solid fa-graduation-cap"></i>

        <div>

        <li><a href="#" onclick="showSection('analytics'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="analytics"><i class="fa-solid fa-chart-line w-5 text-center"></i><span>Analitika</span></a></li>
        <li><a href="#" onclick="showSection('materials'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="materials"><i class="fa-solid fa-book-open w-5 text-center"></i><span>Tananyagok</span></a></li>
      </ul>
    </nav>

    <div class="px-4 pb-6 mt-auto border-t border-gray-100 pt-5 space-y-4">

        <i class="fa-solid fa-arrow-left"></i>

      <div class="rounded-2xl bg-white border border-gray-100 p-4 flex items-center gap-3 shadow-sm">
        <div id="sidebarAvatar" class="w-10 h-10 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-xl flex items-center justify-center text-white font-bold text-lg">?</div>
        <div class="min-w-0">
          <div id="sidebarName" class="font-semibold text-gray-900 text-sm truncate">…</div>
          <div class="text-xs text-[#6C5CE7]">Tanár &bull; <span id="sidebarPlan">…</span></div>
        </div>
        <button onclick="handleLogout()" title="Kijelentkezés" class="ml-auto w-8 h-8 flex items-center justify-center rounded-lg hover:bg-red-50 text-gray-400 hover:text-red-500 transition">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col min-w-0">
    <header class="lg:hidden bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
      <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-gray-100 text-xl text-gray-700"><i class="fa-solid fa-bars"></i></button>
      <a href="index.html" class="flex items-center gap-2 font-bold text-xl gradient-text"><i class="fa-solid fa-graduation-cap text-[#6C5CE7]"></i> AMISEARCH</a>
      <a href="index.html" class="text-sm text-[#6C5CE7] font-medium hover:underline"><i class="fa-solid fa-arrow-left mr-1"></i>Főoldal</a>

  </div>
  </div>
</div>

<div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden" onclick="toggleSidebar()"></div>
<div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-5 py-3 rounded-2xl shadow-2xl hidden z-50 text-sm font-medium">Kész</div>

<!-- New class modal -->
<div id="newClassModal" class="modal fixed inset-0 bg-black/50 backdrop-blur-sm z-50 items-center justify-center p-4">
  <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
    <div class="flex justify-between items-center mb-4">
      <h3 class="text-xl font-bold text-gray-900">Új osztály</h3>
      <button onclick="closeModal('newClassModal')" class="w-9 h-9 hover:bg-gray-100 rounded-lg flex items-center justify-center"><i class="fa-solid fa-xmark text-gray-500"></i></button>
    </div>
    <form onsubmit="event.preventDefault(); submitNewClass();" class="space-y-3">
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Osztály neve</label>
        <input id="newClassName" required class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-[#6C5CE7] outline-none" placeholder="Pl: 9.A Osztály">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Tantárgy</label>
        <input id="newClassSubject" required class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-[#6C5CE7] outline-none" placeholder="Pl: Matematika">
      </div>
      <div>
        <label class="block text-sm font-semibold text-gray-700 mb-1">Diáklétszám</label>
        <input id="newClassStudents" type="number" min="0" value="0" class="w-full px-3 py-2 rounded-lg border border-gray-200 focus:border-[#6C5CE7] outline-none">
      </div>
      <div class="flex gap-2 pt-2">
        <button type="button" onclick="closeModal('newClassModal')" class="flex-1 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg">Mégse</button>
        <button type="submit" class="flex-1 py-2.5 btn-primary text-white font-semibold rounded-lg">Létrehozás</button>
      </div>
    </form>
  </div>
</div>

<script type="module">
/* ────────────────────────────────────────────────────────────────
   SUPABASE AUTH + ROLE GUARD
   ──────────────────────────────────────────────────────────────── */
const { createClient } = await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm');
const supabase = createClient(
  'https://rvgzvseejzbzmcqidnzc.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ2Z3p2c2Vlanpiem1jcWlkbnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg1ODE3NjQsImV4cCI6MjA5NDE1Nzc2NH0.4pSZIbNVMmqF63xMBcZolm0wzgdZvMp9_5jLqOjQzDQ'
);
window.supabaseClient = supabase;
window.teacherProfile = null;

function setGateMsg(html) {
  const el = document.getElementById('authGateMsg');
  if (el) el.innerHTML = html;
}

async function getAuthHeaders(extra) {
  const headers = extra ? Object.assign({}, extra) : {};
  const { data } = await supabase.auth.getSession();
  const token = data.session ? data.session.access_token : null;
  if (token) headers['Authorization'] = 'Bearer ' + token;
  return headers;
}
window.getAuthHeaders = getAuthHeaders;

window.handleLogout = async function() {
  try { await supabase.auth.signOut(); } catch (e) {}
  window.location.href = 'index.html';
};

async function guardAndInit() {
  const { data: { session } } = await supabase.auth.getSession();

  if (!session) {
    setGateMsg('Bejelentkezés szükséges. <a href="index.html" class="text-[#6C5CE7] underline">Belépés</a>');
    return;
  }

  setGateMsg('<i class="fa-solid fa-spinner fa-spin"></i> Profil betöltése...');

  try {
    const res = await fetch('/.netlify/functions/user-profile', { headers: await getAuthHeaders() });
    
    if (!res.ok) {
      throw new Error(`Profile fetch failed: ${res.status}`);
    }
    
    const data = await res.json();
    const profile = data.profile;

    if (!profile) {
      setGateMsg('Profil nem található. <a href="index.html" class="text-[#6C5CE7] underline">Vissza</a>');
      return;
    }

    if (profile.status !== 'teacher') {
      setGateMsg('⚠️ Ez a terület csak tanároknak érhető el.<br><a href="index.html" class="text-[#6C5CE7] underline mt-2 inline-block">Vissza a főoldalra</a>');
      setTimeout(() => { window.location.href = 'index.html'; }, 3000);
      return;
    }

    window.teacherProfile = profile;
    document.getElementById('authGate').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    const initial = (profile.username || profile.fullName || 'T').charAt(0).toUpperCase();
    document.getElementById('sidebarAvatar').textContent = initial;
    document.getElementById('sidebarName').textContent = profile.fullName || profile.username || 'Tanár';
    document.getElementById('sidebarPlan').textContent = String(profile.plan || 'Free').toLowerCase() === 'pro' ? 'Pro' : 'Free';

    window.showSection('dashboard');
    
  } catch (e) {
    console.error('Guard error:', e);
    setGateMsg(`Hiba történt: ${e.message}. <a href="index.html" class="text-[#6C5CE7] underline">Vissza</a>`);
  }
}

guardAndInit();
</script>

<script>
let currentSection = 'dashboard';

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.toggle('hidden');
}

function openModal(id) { document.getElementById(id).classList.add('active'); document.body.style.overflow = 'hidden'; }
function closeModal(id) { document.getElementById(id).classList.remove('active'); document.body.style.overflow = ''; }

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text == null ? '' : String(text);
  return div.innerHTML;
}

/* ────────────────────────────────────────────────────────────────
   CLASSES - real backend with localStorage fallback
   ──────────────────────────────────────────────────────────────── */
window.classesBackendLive = null;

function classesStorageKey() {
  const uid = (window.teacherProfile && window.teacherProfile.id) || 'anon';
  return 'amisearch_teacher_classes_' + uid;
}
function loadClassesLocal() {
  try { return JSON.parse(localStorage.getItem(classesStorageKey()) || '[]'); }
  catch (e) { return []; }
}
function saveClassesLocal(list) {
  localStorage.setItem(classesStorageKey(), JSON.stringify(list));
}

function normalizeClass(row) {
  return {
    id: row.id,
    name: row.name,
    subject: row.subject,
    students: Number(row.students) || 0,
    active: row.active !== false,
  };
}

async function loadClasses() {
  try {
    const resp = await fetch('/.netlify/functions/classes', { headers: await window.getAuthHeaders() });
    if (resp.ok) {
      window.classesBackendLive = true;
      const data = await resp.json();
      return Array.isArray(data) ? data.map(normalizeClass) : [];
    }
    window.classesBackendLive = false;
  } catch (e) {
    window.classesBackendLive = false;
  }
  return loadClassesLocal().map(normalizeClass);
}

window.submitNewClass = async function() {
  const name = document.getElementById('newClassName').value.trim();
  const subject = document.getElementById('newClassSubject').value.trim();
  const students = parseInt(document.getElementById('newClassStudents').value || '0', 10) || 0;
  if (!name || !subject) return;

  if (window.classesBackendLive !== false) {
    try {
      const resp = await fetch('/.netlify/functions/classes', {
        method: 'POST',
        headers: await window.getAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ name, subject, students }),
      });
      if (resp.ok) {
        window.classesBackendLive = true;
        closeModal('newClassModal');
        resetNewClassForm();
        showToast('Osztály létrehozva!');
        showSection('classes');
        return;
      }
      window.classesBackendLive = false;
    } catch (e) {
      window.classesBackendLive = false;
    }
  }

  const list = loadClassesLocal();
  list.push({ id: 'c' + Date.now(), name, subject, students, active: true, createdAt: new Date().toISOString() });
  saveClassesLocal(list);
  closeModal('newClassModal');
  resetNewClassForm();
  showToast('Osztály létrehozva (helyben tárolva)');
  showSection('classes');
};

function resetNewClassForm() {
  document.getElementById('newClassName').value = '';
  document.getElementById('newClassSubject').value = '';
  document.getElementById('newClassStudents').value = '0';
}

window.deleteClass = async function(id) {
  if (!confirm('Biztosan törlöd ezt az osztályt?')) return;

  if (window.classesBackendLive !== false) {
    try {
      const resp = await fetch('/.netlify/functions/classes?id=' + encodeURIComponent(id), {
        method: 'DELETE',
        headers: await window.getAuthHeaders(),
      });
      if (resp.ok) { window.classesBackendLive = true; showSection('classes'); return; }
      window.classesBackendLive = false;
    } catch (e) {
      window.classesBackendLive = false;
    }
  }

  saveClassesLocal(loadClassesLocal().filter(c => c.id !== id));
  showSection('classes');
};

window.toggleClassActive = async function(id, currentActive) {
  if (window.classesBackendLive !== false) {
    try {
      const resp = await fetch('/.netlify/functions/classes?id=' + encodeURIComponent(id), {
        method: 'PATCH',
        headers: await window.getAuthHeaders({ 'Content-Type': 'application/json' }),
        body: JSON.stringify({ active: !currentActive }),
      });
      if (resp.ok) { window.classesBackendLive = true; showSection('classes'); return; }
      window.classesBackendLive = false;
    } catch (e) {
      window.classesBackendLive = false;
    }
  }

  const list = loadClassesLocal().map(c => c.id === id ? Object.assign({}, c, { active: !c.active }) : c);
  saveClassesLocal(list);
  showSection('classes');
};

/* ────────────────────────────────────────────────────────────────
   SECTION ROUTER
   ──────────────────────────────────────────────────────────────── */
function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-link').forEach(link => {
    link.className = link.dataset.section === section
      ? 'nav-link flex items-center gap-3 px-4 py-3 rounded-xl nav-link-active transition'
      : 'nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700';
  });
  const main = document.getElementById('main-content');
  main.className = 'flex-1 p-6 lg:p-10 fade-in';
  void main.offsetWidth;

  switch (section) {
    case 'dashboard': renderDashboard(); break;
    case 'classes': renderClasses(); break;
    case 'exams': renderExams(); break;
    case 'analytics': renderAnalytics(); break;
    case 'materials': renderMaterials(); break;
    default: renderDashboard();
  }
}
window.showSection = showSection;

  const classes = await loadClasses();

        <p class="text-gray-500">${classes.length} osztály &bull; ${totalStudents} diák összesen</p>
      </div>
      <div class="grid grid-cols-2 md:grid-cols-3 gap-5 mb-10">
        <div class="stat-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 bg-[#F3F0FF] rounded-xl flex items-center justify-center"><i class="fa-solid fa-users text-[#6C5CE7]"></i></div>
            <span class="text-sm text-gray-500">Osztályok</span>
          </div>
          <div class="text-4xl font-extrabold text-gray-900">${classes.length}</div>
        </div>
        <div class="stat-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 bg-[#F3F0FF] rounded-xl flex items-center justify-center"><i class="fa-solid fa-user-graduate text-[#6C5CE7]"></i></div>
            <span class="text-sm text-gray-500">Diákok</span>
          </div>
          <div class="text-4xl font-extrabold text-gray-900">${totalStudents}</div>
        </div>
        <div class="stat-card bg-white p-6 rounded-2xl shadow-sm border border-gray-100">
          <div class="flex items-center gap-3 mb-3">
            <div class="w-10 h-10 bg-emerald-50 rounded-xl flex items-center justify-center"><i class="fa-solid fa-crown text-emerald-600"></i></div>
            <span class="text-sm text-gray-500">Előfizetés</span>
          </div>
          <div class="text-2xl font-extrabold text-emerald-600">${String(profile.plan || 'Free').toLowerCase() === 'pro' ? 'Pro' : 'Free'}</div>
        </div>
      </div>

      <div class="grid lg:grid-cols-3 gap-6">
        <div class="lg:col-span-1 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
          <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-bolt text-[#6C5CE7]"></i> Gyors műveletek</h3>
          <div class="space-y-3">
            <button onclick="showSection('classes')" class="w-full flex items-center gap-3 p-3 bg-gray-50 hover:bg-[#F3F0FF] rounded-xl transition text-left">
              <div class="w-9 h-9 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-lg flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-users text-white text-sm"></i></div>
              <span class="text-sm font-medium text-gray-700">Osztályok kezelése</span>
            </button>
            <button onclick="showSection('materials')" class="w-full flex items-center gap-3 p-3 bg-gray-50 hover:bg-[#F3F0FF] rounded-xl transition text-left">
              <div class="w-9 h-9 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-lg flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-book-open text-white text-sm"></i></div>
              <span class="text-sm font-medium text-gray-700">Feltöltött jegyzeteim</span>
            </button>
            <a href="index.html#exam-simulator" class="w-full flex items-center gap-3 p-3 bg-gray-50 hover:bg-[#F3F0FF] rounded-xl transition text-left">
              <div class="w-9 h-9 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-lg flex items-center justify-center flex-shrink-0"><i class="fa-solid fa-file-circle-plus text-white text-sm"></i></div>
              <span class="text-sm font-medium text-gray-700">AI vizsgaszimulátor megnyitása</span>
            </a>
          </div>
        </div>

        <div class="lg:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
          <h3 class="font-bold text-gray-900 mb-4 flex items-center gap-2"><i class="fa-solid fa-users text-[#6C5CE7]"></i> Osztályaim</h3>
          ${classes.length ? `

async function renderMaterials() {
  const main = document.getElementById('main-content');
  main.innerHTML = `
    <div class="max-w-7xl mx-auto">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-3xl font-bold text-gray-900 mb-1">Tananyagok</h1>
          <p class="text-gray-500">A saját fiókodba feltöltött jegyzeteid</p>
        </div>
        <a href="index.html" class="btn-primary px-5 py-2.5 text-white font-semibold rounded-xl flex items-center gap-2">
          <i class="fa-solid fa-cloud-arrow-up"></i> Feltöltés a főoldalon
        </a>
      </div>
      <div id="materialsList" class="grid md:grid-cols-2 lg:grid-cols-3 gap-5">
        <div class="col-span-full flex items-center gap-2 text-gray-400 py-6 justify-center"><i class="fa-solid fa-spinner fa-spin"></i><span>Jegyzetek betöltése...</span></div>
      </div>
    </div>
  `;

  const listEl = document.getElementById('materialsList');
  try {
    const resp = await fetch('/.netlify/functions/notes', { headers: await window.getAuthHeaders() });
    if (!resp.ok) {
      listEl.innerHTML = '<div class="col-span-full text-center text-red-500 py-6">Hiba a jegyzetek betöltésekor.</div>';
      return;
    }
    const notes = await resp.json();
    if (!Array.isArray(notes) || notes.length === 0) {
      listEl.innerHTML = `
        <div class="col-span-full bg-gray-50 border-2 border-dashed border-gray-200 rounded-2xl p-10 text-center text-gray-400">
          <i class="fa-solid fa-book-open text-3xl mb-3"></i>
          <p class="text-sm">Még nincs feltöltött jegyzeted. <a href="index.html" class="text-[#6C5CE7] font-semibold hover:underline">Tölts fel egyet a főoldalon</a>.</p>
        </div>
      `;
      return;
    }
    listEl.innerHTML = notes.map(n => {
      const title = n.title || n.originalName || n.fileName || 'Névtelen jegyzet';
      const subject = n.subject || '';
      const ext = ((n.originalName || n.fileName || '').split('.').pop() || 'file').toLowerCase();
      const iconMap = { pdf: ['fa-file-pdf', 'text-red-500 bg-red-50'], docx: ['fa-file-word', 'text-blue-500 bg-blue-50'], pptx: ['fa-file-powerpoint', 'text-orange-500 bg-orange-50'] };
      const [icon, color] = iconMap[ext] || ['fa-file-lines', 'text-gray-500 bg-gray-100'];
      return `
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-5 flex items-center gap-4 hover:shadow-md transition">
          <div class="w-12 h-12 ${color} rounded-xl flex items-center justify-center flex-shrink-0"><i class="fa-solid ${icon} text-xl"></i></div>
          <div class="flex-1 min-w-0">
            <p class="font-medium text-gray-900 text-sm truncate">${escapeHtml(title)}</p>
            <p class="text-xs text-gray-400">${escapeHtml(subject)}</p>
          </div>
          <button onclick="downloadMaterial('${n.id}')" class="text-[#6C5CE7] hover:text-[#5A4BD1] transition" title="Letöltés"><i class="fa-solid fa-download"></i></button>
        </div>
      `;
    }).join('');
  } catch (e) {
    listEl.innerHTML = '<div class="col-span-full text-center text-red-500 py-6">' + escapeHtml(e.message || String(e)) + '</div>';
  }
}

window.downloadMaterial = async function(noteId) {
  try {
    const resp = await fetch('/.netlify/functions/download-my-note?id=' + encodeURIComponent(noteId), { headers: await window.getAuthHeaders() });
    const data = await resp.json().catch(() => ({}));
    if (!resp.ok || !data.url) { showToast('Letöltési hiba'); return; }
    const a = document.createElement('a');
    a.href = data.url; a.target = '_blank'; a.rel = 'noopener';
    if (data.originalName) a.download = data.originalName;
    document.body.appendChild(a); a.click(); a.remove();
  } catch (e) {
    showToast('Letöltési hiba');
  }
};
</script>
