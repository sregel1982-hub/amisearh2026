<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMISEARCH – Teacher Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['Poppins', 'system-ui', 'sans-serif'] },
          colors: {
            amisearch: { DEFAULT: '#6C5CE7', light: '#A29BFE', soft: '#F3F0FF', dark: '#5A4BD1' }
          }
        }
      }
    }
  </script>
  <style>
    * { font-family: 'Poppins', system-ui, sans-serif; box-sizing: border-box; }
    body { scroll-behavior: smooth; overflow-x: hidden; }
    .card { border-radius: 1.25rem; }
    .logo { letter-spacing: -0.04em; }

    .btn-primary {
      background: linear-gradient(135deg, #6C5CE7 0%, #5A4BD1 100%);
      transition: all 0.3s ease;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(108, 92, 231, 0.4);
    }

    .gradient-text {
      background: linear-gradient(135deg, #6C5CE7 0%, #A29BFE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .nav-link-active {
      background: #F3F0FF;
      color: #6C5CE7;
      font-weight: 600;
    }

    .scroller-thin::-webkit-scrollbar { width: 4px; }
    .scroller-thin::-webkit-scrollbar-track { background: transparent; }
    .scroller-thin::-webkit-scrollbar-thumb { background: #e5e7eb; border-radius: 4px; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .fade-in { animation: fadeIn 0.3s ease; }

    .stat-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .stat-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 12px 28px -8px rgba(108, 92, 231, 0.18);
    }
  </style>
</head>
<body class="bg-gray-50 antialiased min-h-screen">

<div id="app" class="min-h-screen flex">

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed lg:sticky top-0 left-0 z-40 w-[268px] h-screen bg-white border-r border-gray-200 flex flex-col transition-transform -translate-x-full lg:translate-x-0 shadow-sm">

    <!-- Logo – click goes back to main page -->
    <div class="px-6 pt-6 pb-5 border-b border-gray-100">
      <a href="index.html" class="flex items-center gap-3 group" title="Vissza a főoldalra">
        <div class="w-11 h-11 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-2xl flex items-center justify-center text-white text-xl shadow">
          <i class="fa-solid fa-graduation-cap"></i>
        </div>
        <div>
          <div class="font-bold text-2xl text-gray-900 logo group-hover:text-[#6C5CE7] transition">AMISEARCH</div>
          <div class="text-xs text-[#6C5CE7] font-semibold">Teacher Hub</div>
        </div>
      </a>
    </div>

    <!-- Navigation -->
    <nav class="px-3 pt-5 flex-1 overflow-y-auto scroller-thin">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-4 mb-2">Menü</p>
      <ul class="space-y-1">
        <li>
          <a href="#" onclick="showSection('dashboard'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl nav-link-active transition" data-section="dashboard">
            <i class="fa-solid fa-border-all w-5 text-center"></i>
            <span>Irányítópult</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="showSection('classes'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="classes">
            <i class="fa-solid fa-users w-5 text-center"></i>
            <span>Osztályaim</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="showSection('exams'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="exams">
            <i class="fa-solid fa-file-lines w-5 text-center"></i>
            <span>Online Vizsgák</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="showSection('analytics'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="analytics">
            <i class="fa-solid fa-chart-line w-5 text-center"></i>
            <span>Analitika</span>
          </a>
        </li>
        <li>
          <a href="#" onclick="showSection('materials'); return false;" class="nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700" data-section="materials">
            <i class="fa-solid fa-book-open w-5 text-center"></i>
            <span>Tananyagok</span>
          </a>
        </li>
      </ul>
    </nav>

    <!-- Bottom -->
    <div class="px-4 pb-6 mt-auto border-t border-gray-100 pt-5 space-y-4">
      <!-- Mode switcher -->
      <div class="bg-[#F3F0FF] rounded-2xl p-1 flex text-sm font-medium">
        <button id="mode-btn-teacher" onclick="setMode('teacher')"
          class="flex-1 py-2.5 rounded-xl bg-white shadow text-[#6C5CE7] transition">
          <i class="fa-solid fa-chalkboard-user mr-1"></i> Tanár
        </button>
        <button id="mode-btn-student" onclick="setMode('student')"
          class="flex-1 py-2.5 rounded-xl text-gray-500 hover:text-gray-700 transition">
          <i class="fa-solid fa-user-graduate mr-1"></i> Diák
        </button>
      </div>

      <!-- Back to main page -->
      <a href="index.html"
        class="flex items-center gap-2 px-4 py-3 rounded-xl bg-gray-50 hover:bg-[#F3F0FF] text-gray-600 hover:text-[#6C5CE7] transition text-sm font-medium">
        <i class="fa-solid fa-arrow-left"></i>
        <span>Vissza a főoldalra</span>
      </a>

      <!-- User card -->
      <div class="rounded-2xl bg-white border border-gray-100 p-4 flex items-center gap-3 shadow-sm">
        <div class="w-10 h-10 bg-gradient-to-br from-[#6C5CE7] to-[#A29BFE] rounded-xl flex items-center justify-center text-white font-bold text-lg">K</div>
        <div class="min-w-0">
          <div class="font-semibold text-gray-900 text-sm truncate">Katalin</div>
          <div class="text-xs text-[#6C5CE7]">Tanár &bull; Pro</div>
        </div>
      </div>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="flex-1 flex flex-col min-w-0">

    <!-- Mobile header -->
    <header class="lg:hidden bg-white border-b border-gray-100 px-4 py-3 flex items-center justify-between shadow-sm">
      <button onclick="toggleSidebar()" class="p-2 rounded-xl hover:bg-gray-100 text-xl text-gray-700">
        <i class="fa-solid fa-bars"></i>
      </button>
      <a href="index.html" class="flex items-center gap-2 font-bold text-xl gradient-text">
        <i class="fa-solid fa-graduation-cap text-[#6C5CE7]"></i> AMISEARCH
      </a>
      <a href="index.html" class="text-sm text-[#6C5CE7] font-medium hover:underline">
        <i class="fa-solid fa-arrow-left mr-1"></i>Főoldal
      </a>
    </header>

    <main id="main-content" class="flex-1 p-6 lg:p-10 fade-in"></main>
  </div>
</div>

<!-- Mobile sidebar overlay -->
<div id="sidebar-overlay" class="hidden fixed inset-0 bg-black/40 z-30 lg:hidden" onclick="toggleSidebar()"></div>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 bg-gray-800 text-white px-5 py-3 rounded-2xl shadow-2xl hidden z-50 text-sm font-medium">Kész</div>

<script>
let currentMode = 'teacher';
let currentSection = 'dashboard';

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('-translate-x-full');
  document.getElementById('sidebar-overlay').classList.toggle('hidden');
}

function setMode(m) {
  currentMode = m;
  const tBtn = document.getElementById('mode-btn-teacher');
  const sBtn = document.getElementById('mode-btn-student');
  if (m === 'teacher') {
    tBtn.className = 'flex-1 py-2.5 rounded-xl bg-white shadow text-[#6C5CE7] transition';
    sBtn.className = 'flex-1 py-2.5 rounded-xl text-gray-500 hover:text-gray-700 transition';
  } else {
    sBtn.className = 'flex-1 py-2.5 rounded-xl bg-white shadow text-[#6C5CE7] transition';
    tBtn.className = 'flex-1 py-2.5 rounded-xl text-gray-500 hover:text-gray-700 transition';
  }
  showSection(currentSection);
}

function showSection(section) {
  currentSection = section;
  document.querySelectorAll('.nav-link').forEach(link => {
    if (link.dataset.section === section) {
      link.className = 'nav-link flex items-center gap-3 px-4 py-3 rounded-xl nav-link-active transition';
    } else {
      link.className = 'nav-link flex items-center gap-3 px-4 py-3 rounded-xl hover:bg-gray-100 transition text-gray-700';
    }
  });
  const main = document.getElementById('main-content');
  main.className = 'flex-1 p-6 lg:p-10 fade-in';
  void main.offsetWidth;
  switch(section) {
    case 'dashboard':  main.innerHTML = dashboardHTML(); break;
    case 'classes':    main.innerHTML = classesHTML(); break;
    case 'exams':      main.innerHTML = examsHTML(); break;
    case 'analytics':  main.innerHTML = analyticsHTML(); break;
    case 'materials':  main.innerHTML = materialsHTML(); break;
    default:           main.innerHTML = dashboardHTML();
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  setTimeout(() => t.classList.add('hidden'), 2500);
}

        <div>

        </div>
        <button onclick="showToast('Új osztály létrehozva!')" class="btn-primary px-5 py-2.5 text-white font-semibold rounded-xl flex items-center gap-2">

/* ── Analytics ── */

  return `
