/* Credit line — bottom-right */
.design-ui-credit {
  position: fixed;
  bottom: 12px;
  right: 12px;
  font: 11px/1 system-ui, sans-serif;
  color: rgba(128,128,128,0.5);
  pointer-events: none;
  z-index: 2147483647;
  transition: opacity 0.4s ease;
  user-select: none;
  letter-spacing: 0.02em;
}

/* Hide chrome on touch devices */
@media (hover: none) {
  .design-ui-credit { display: none; }
}

/* Print fixes */
@media print {
  * {
    transition: none !important;
    animation: none !important;
    box-shadow: none !important;
  }
  body {
    print-color-adjust: exact;

<script>
(function () {
    // Design-ui pages are single compositions, so the whole body is editable.
    function markEditable() {
        document.body.classList.add('artifact-editable');
    }

    // Credit badge with idle-fade. Hover devices only.
    function initChromeUI() {
        if (!matchMedia('(hover: hover)').matches) return;

        var credit = document.createElement('div');
        credit.className = 'design-ui-credit';
        credit.setAttribute('aria-hidden', 'true');
        credit.innerHTML = '\u{1F49C} by ClickUp Brain';
        document.body.appendChild(credit);

        var timer = null;
        var fade = function (out) { credit.style.opacity = out ? '0' : ''; };
        fade(true);
        var show = function () {
            fade(false);
            clearTimeout(timer);
            timer = setTimeout(function () { fade(true); }, 3000);
        };
        document.addEventListener('mousemove', show);
        show();
    }

    function init() {
        markEditable();
        initChromeUI();
    }

    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
    } else {
        init();
    }
})();

</script>

  <script>
    const SUPABASE_URL='https://rvgzvseejzbzmcqidnzc.supabase.co';
    const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx2Z3p2c2Vlampiem1jcWlkbnpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc1ODE3NjQsImV4cCI6MjA5NDE1Nzc2NH0.4pSZIbNVMmqF63xMBcZolm0wzgdZvMp9_5jLqOjQzDQ';
    const REST=SUPABASE_URL+'/rest/v1/'; const STORAGE=SUPABASE_URL+'/storage/v1/'; const SESSION_KEY='amisearch_teacher_session';
    let session=loadSession(), profile=null, mode='login', toastTimer;
    const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)]; const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); const initials=v=>(String(v||'T').trim().split(/\s+/).map(x=>x[0]).join('').slice(0,2)||'T').toUpperCase();
    function loadSession(){try{return JSON.parse(localStorage.getItem(SESSION_KEY)||'null')}catch{return null}} function saveSession(v){session=v;if(v)localStorage.setItem(SESSION_KEY,JSON.stringify(v));else localStorage.removeItem(SESSION_KEY)}
    function headers(extra={}){return{apikey:SUPABASE_ANON_KEY,Authorization:'Bearer '+(session?.access_token||SUPABASE_ANON_KEY),...extra}} async function api(url,opt={}){const r=await fetch(url,{...opt,headers:headers(opt.headers||{})});const t=await r.text();let b=null;try{b=t?JSON.parse(t):null}catch{b=t}if(!r.ok)throw new Error(b?.message||b?.hint||b?.error_description||(typeof b==='string'?b:'HTTP '+r.status));return b}
    function toast(msg,error=false){const x=$('#toast');x.textContent=msg;x.className='toast show'+(error?' error':'');clearTimeout(toastTimer);toastTimer=setTimeout(()=>x.className='toast',3000)} function errorBox(msg=''){const x=$('#authError');x.textContent=msg;x.classList.toggle('hidden',!msg)}
    async function signIn(email,password){return api(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password})})} async function signUp(email,password,name){return api(SUPABASE_URL+'/auth/v1/signup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,password,data:{full_name:name,status:'teacher'}})})}
    async function logout(){try{await api(SUPABASE_URL+'/auth/v1/logout',{method:'POST'})}catch{}saveSession(null);profile=null;location.reload()}
    async function getProfile(){const rows=await api(REST+'profiles?select=*&id=eq.'+encodeURIComponent(session.user.id));return rows?.[0]||null}
    async function start(){if(!session?.access_token)return showAuth();try{profile=await getProfile();if(!profile)throw new Error('A profilod nem található. Futtasd le a mellékelt SQL sémát a Supabase-ben.');const status=String(profile.status||profile.role||'').toLowerCase();if(!['teacher','tanár','admin'].includes(status))throw new Error('Ez a terület csak tanári profiloknak érhető el.');const name=profile.full_name||profile.fullName||profile.username||session.user.email;const plan=String(profile.plan||'Free').toLowerCase()==='pro'?'Pro':'Free';$('#authScreen').classList.add('hidden');$('#app').classList.remove('hidden');$('#topName').textContent=profile.username||session.user.email.split('@')[0];$('#topRole').textContent='Tanár · '+plan;$('#topAvatar').textContent=initials(name).slice(0,1);$('#miniName').textContent=name;$('#miniPlan').textContent='Tanár · '+plan;$('#miniAvatar').textContent=initials(name).slice(0,1);await go(location.hash.slice(1)||'dashboard')}catch(e){saveSession(null);showAuth(e.message)}}
    function showAuth(msg=''){$('#authScreen').classList.remove('hidden');$('#app').classList.add('hidden');errorBox(msg)}
    $('#loginTab').onclick=()=>setMode('login');$('#signupTab').onclick=()=>setMode('signup');function setMode(m){mode=m;const s=m==='signup';$('#loginTab').classList.toggle('active',!s);$('#signupTab').classList.toggle('active',s);$('#nameField').classList.toggle('hidden',!s);$('#authName').required=s;$('#authTitle').textContent=s?'Tanári fiók létrehozása':'Üdv újra';$('#authSubtitle').textContent=s?'Készíts tanári fiókot az éles Teacher Hubhoz.':'Lépj be a Teacher Hub felületére.';$('#authSubmit').textContent=s?'Regisztráció':'Belépés';errorBox()}
    $('#authForm').onsubmit=async e=>{e.preventDefault();const b=$('#authSubmit');b.disabled=true;b.textContent='Feldolgozás…';errorBox();try{const d=mode==='signup'?await signUp($('#authEmail').value.trim(),$('#authPassword').value,$('#authName').value.trim()):await signIn($('#authEmail').value.trim(),$('#authPassword').value);if(mode==='signup'&&!d.access_token){errorBox('Ellenőrizd a postafiókod, majd lépj be a megerősített e-maillel.');return}saveSession(d);await start()}catch(x){errorBox(x.message)}finally{b.disabled=false;b.textContent=mode==='signup'?'Regisztráció':'Belépés'}};
    $('#logoutTop').onclick=e=>{e.preventDefault();logout()};$('#logoutSide').onclick=logout;$('#menuBtn').onclick=()=>{$('#sidebar').classList.add('open');$('#mobileOverlay').classList.remove('hidden')};$('#mobileOverlay').onclick=()=>{$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.add('hidden')};$$('.nav button').forEach(b=>b.onclick=()=>{go(b.dataset.section);$('#sidebar').classList.remove('open');$('#mobileOverlay').classList.add('hidden')});
    async function classes(){return api(REST+'teacher_classes?select=id,name,subject,students,active,created_at&teacher_id=eq.'+encodeURIComponent(session.user.id)+'&order=created_at.desc')} async function notes(){return api(REST+'teacher_notes?select=id,title,subject,original_name,storage_path,created_at&owner_id=eq.'+encodeURIComponent(session.user.id)+'&order=created_at.desc')} async function optional(table){try{return await api(REST+table+'?select=*&teacher_id=eq.'+encodeURIComponent(session.user.id)+'&order=created_at.desc')}catch{return[]}}
    async function updateClass(id,data){return api(REST+'teacher_classes?id=eq.'+encodeURIComponent(id)+'&teacher_id=eq.'+encodeURIComponent(session.user.id),{method:'PATCH',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(data)})} async function addClass(data){return api(REST+'teacher_classes',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({...data,teacher_id:session.user.id})})} async function deleteClass(id){return api(REST+'teacher_classes?id=eq.'+encodeURIComponent(id)+'&teacher_id=eq.'+encodeURIComponent(session.user.id),{method:'DELETE'})}
    function stat(icon,label,value){return `<div class="stat"><div class="stat-head"><span class="stat-icon">${icon}</span>${esc(label)}</div><div class="stat-value">${esc(value)}</div></div>`} function wait(){ $('#main').innerHTML='<div class="empty"><b>Adatok betöltése…</b><span>Kapcsolódás a Supabase adatbázishoz.</span></div>'} function nav(){ $$('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.section===location.hash.slice(1))) }
    async function go(section){const allowed=['dashboard','classes','exams','analytics','materials'];section=allowed.includes(section)?section:'dashboard';location.hash=section;nav();wait();try{if(section==='dashboard')return dashboard();if(section==='classes')return classPage();if(section==='exams')return exams();if(section==='analytics')return analytics();return materials()}catch(e){$('#main').innerHTML=`<div class="empty"><b>Nem sikerült betölteni</b><span>${esc(e.message)}</span></div>`}} window.go=go;
    const classRow=c=>`<div class="activity-row"><span class="activity-icon">♣</span><div class="activity-copy"><b>${esc(c.name)}</b><span>${esc(c.subject)} · ${Number(c.students)||0} diák</span></div></div>`;
    async function dashboard(){const [cs,ex,acts]=await Promise.all([classes(),optional('teacher_exams'),optional('teacher_activity')]);const total=cs.reduce((a,c)=>a+(Number(c.students)||0),0);const name=profile.full_name||profile.fullName||profile.username||'Tanár';const act=acts.slice(0,4);$('#main').innerHTML=`<div class="page-head"><h1>Jó napot, ${esc(name)}! 👋</h1><p>${cs.filter(c=>c.active).length} aktív osztály · ${ex.length} vizsga vár beadandó</p></div><div class="stats">${stat('♣','Osztályok',cs.length)}${stat('♟','Diákok',total)}${stat('▤','Feladatsor',ex.length)}${stat('⌁','Aktivitás',act.length?Math.min(100,Math.round(act.length*24))+'%':'0%')}</div><div class="lower"><section class="panel"><h2 class="panel-title"><span class="accent">ϟ</span>Gyors műveletek</h2><div class="quick"><button data-go="exams"><span class="quick-icon">▤</span><span>Új vizsga létrehozása</span></button><button data-go="classes"><span class="quick-icon">♣</span><span>Osztályok kezelése</span></button><button data-go="analytics"><span class="quick-icon">▤</span><span>Statisztikák</span></button><a class="quick" href="index.html" style="display:flex;align-items:center;gap:11px;background:oklch(98% .006 250);border-radius:10px;padding:10px"><span class="quick-icon">⌂</span><span>Vissza a főoldalra</span></a></div></section><section class="panel"><h2 class="panel-title"><span class="accent">⟲</span>Legutóbbi tevékenység</h2><div class="activity">${act.length?act.map((a,i)=>`<div class="activity-row"><span class="activity-icon">${i===0?'▤':i===1?'♟':i===2?'⌁':'!'}</span><div class="activity-copy"><b>${esc(a.title||a.message||a.name||'Tevékenység')}</b><span>${esc(a.time_label||'Most')}</span></div></div>`).join(''):cs.length?cs.slice(0,4).map(classRow).join(''):`<div class="empty"><b>Még nincs aktivitás</b><span>A mentett osztályok itt jelennek meg.</span></div>`}</div></section></div>`;bindGo()}
    function bindGo(){$$('[data-go]').forEach(x=>x.onclick=e=>{e.preventDefault();go(x.dataset.go)})}
    async function classPage(){const cs=await classes();$('#main').innerHTML=`<div class="subpage-head"><div><h1>Osztályaim</h1><p>Kezeld az osztályaidat és a hozzájuk tartozó létszámot.</p></div></div><section class="panel form-panel"><h2 class="panel-title"><span class="accent">+</span>Új osztály</h2><form id="classForm" class="form-grid"><div class="field"><label>Osztály neve</label><input class="input" id="cName" required placeholder="9.B osztály"></div><div class="field"><label>Tantárgy</label><input class="input" id="cSubject" required placeholder="Matematika"></div><div class="field"><label>Diáklétszám</label><input class="input" id="cStudents" type="number" min="0" value="0"></div><button class="btn btn-primary" type="submit">Létrehozás</button></form></section><section class="class-grid">${cs.length?cs.map(c=>`<article class="class-card"><div class="class-top"><div><h3>${esc(c.name)}</h3><div class="class-sub">${esc(c.subject)}</div></div><span class="pill ${c.active?'on':'off'}">${c.active?'Aktív':'Archivált'}</span></div><div class="class-foot"><span>♣ ${Number(c.students)||0} diák</span><span><button class="text-btn" data-toggle="${esc(c.id)}" data-active="${c.active}">${c.active?'Archiválás':'Aktiválás'}</button><button class="text-btn danger" data-delete="${esc(c.id)}">Törlés</button></span></div></article>`).join(''):`<div class="empty"><b>Még nincs osztályod</b><span>A fenti űrlappal hozz létre egyet.</span></div>`}</section>`;$('#classForm').onsubmit=async e=>{e.preventDefault();try{await addClass({name:$('#cName').value.trim(),subject:$('#cSubject').value.trim(),students:Number($('#cStudents').value)||0,active:true});toast('Osztály létrehozva');go('classes')}catch(x){toast(x.message,true)}};$$('[data-toggle]').forEach(b=>b.onclick=async()=>{try{await updateClass(b.dataset.toggle,{active:b.dataset.active!=='true'});go('classes')}catch(x){toast(x.message,true)}});$$('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Biztosan törlöd ezt az osztályt?'))return;try{await deleteClass(b.dataset.delete);toast('Osztály törölve');go('classes')}catch(x){toast(x.message,true)}})}
    function exams(){$('#main').innerHTML=`<div class="subpage-head"><div><h1>Online Vizsgák</h1><p>Az AI vizsgaszimulátor továbbra is a főoldalon érhető el.</p></div></div><section class="exam"><div><h2>AI vizsgaszimulátor</h2><p>Adj meg témát, nehézséget és időtartamot, az AI elkészíti az időzített feladatsort.</p></div><a class="btn" href="index.html#exam-simulator">Megnyitás →</a></section>`}
    async function analytics(){const cs=await classes();const total=cs.reduce((a,c)=>a+(Number(c.students)||0),0);const max=Math.max(...cs.map(c=>Number(c.students)||0),1);const avg=cs.length?Math.round(total/cs.length):0;$('#main').innerHTML=`<div class="subpage-head"><div><h1>Analitika</h1><p>Valós osztályadatok, demo számok nélkül.</p></div></div><div class="analytics-grid">${stat('♣','Összes diák',total)}${stat('▤','Osztályok',cs.length)}${stat('⌁','Átlag osztálylétszám',avg)}</div><section class="panel"><h2 class="panel-title"><span class="accent">⌁</span>Osztályonkénti létszám</h2>${cs.length?`<div class="chart">${cs.map(c=>`<div class="bar-item"><span class="bar-value">${Number(c.students)||0}</span><div class="bar-track"><div class="bar-fill" style="height:${Math.max(3,Math.round((Number(c.students)||0)/max*100))}%"></div></div><span class="bar-label" title="${esc(c.name)}">${esc(c.name)}</span></div>`).join('')}</div>`:`<div class="empty"><b>Nincs adat</b><span>Hozz létre osztályokat, hogy megjelenjen az analitika.</span></div>`}</section>`}
    async function upload(file,title,subject){const path=session.user.id+'/'+crypto.randomUUID()+'-'+file.name.toLowerCase().replace(/[^a-z0-9._-]+/g,'-');await api(STORAGE+'object/teacher-notes/'+path,{method:'POST',headers:{'Content-Type':file.type||'application/octet-stream','x-upsert':'false'},body:file});return api(REST+'teacher_notes',{method:'POST',headers:{'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify({owner_id:session.user.id,title:title||file.name,subject:subject||'',original_name:file.name,storage_path:path})})} async function download(n){const r=await api(STORAGE+'object/sign/teacher-notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({paths:[n.storage_path],expiresIn:3600})});const u=Array.isArray(r)?r[0]?.signedURL:r?.signedURL;if(u)window.open(u.startsWith('http')?u:STORAGE.replace('/storage/v1/','')+u,'_blank','noopener')}
    async function materials(){const ns=await notes();$('#main').innerHTML=`<div class="subpage-head"><div><h1>Tananyagok</h1><p>A saját fiókodba feltöltött jegyzeteid.</p></div></div><div class="notice">A fájlok a Supabase Storage privát <b>teacher-notes</b> bucketjébe kerülnek.</div><section class="panel upload"><h2 class="panel-title"><span class="accent">↑</span>Tananyag feltöltése</h2><form id="uploadForm" class="upload-grid"><div class="field"><label>Cím</label><input class="input" id="nTitle" placeholder="Algebra alapok"></div><div class="field"><label>Tantárgy</label><input class="input" id="nSubject" placeholder="Matematika"></div><div class="field"><label>Fájl, max. 15 MB</label><div class="file-input"><input id="nFile" type="file" accept=".pdf,.docx,.pptx,.txt,.md" required></div></div><button class="btn btn-primary" type="submit">Feltöltés</button></form><div class="material-grid">${ns.length?ns.map(n=>`<article class="material-card"><span class="file-icon">▤</span><div class="material-copy"><b>${esc(n.title||n.original_name)}</b><span>${esc(n.subject||'Nincs tantárgy')}</span></div><button class="download" data-download="${esc(n.id)}">↓</button></article>`).join(''):`<div class="empty"><b>Még nincs feltöltött tananyagod</b><span>Az első fájl feltöltése után itt lesz mindenhol elérhető.</span></div>`}</div></section>`;$('#uploadForm').onsubmit=async e=>{e.preventDefault();const f=$('#nFile').files[0];if(!f)return;if(f.size>15*1024*1024)return toast('A fájl legfeljebb 15 MB lehet.',true);try{await upload(f,$('#nTitle').value.trim(),$('#nSubject').value.trim());toast('Tananyag feltöltve');go('materials')}catch(x){toast(x.message,true)}};$$('[data-download]').forEach(b=>b.onclick=async()=>{try{await download(ns.find(n=>n.id===b.dataset.download))}catch(x){toast(x.message,true)}})}
    start();
  </script>
