[build]
  command = "vite build"
  publish = "dist"
  functions = "netlify/functions"

# 1. API ROUTES - NE irányítsa index.html-re, engedje a functiont futni
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# 2. Minden más megy index.html-re (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = { Role = ["admin"] }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Kivételek: ne írja felül az API-t és a statikus file-okat
  force = false

# 3. SECURITY HEADERS - EZT KÉRTE A SRÁC (CSP + SRI védelem)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP: csak saját + Google Fonts + Supabase + Gemini engedélyezett
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https: blob:; connect-src 'self' https://*.supabase.co https://generativelanguage.googleapis.com https://api.openai.com https://*.netlify.app; frame-ancestors 'none'"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# 4. API-nál külön: ne cache-elje, mindig JSON legyen
[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Content-Type = "application/json; charset=utf-8"
